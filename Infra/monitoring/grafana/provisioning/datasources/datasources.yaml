# Grafana가 시작할 때 읽는 데이터 소스 설정. 화면에서 직접 만들지 않아도 같은 설정이 복원된다.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
