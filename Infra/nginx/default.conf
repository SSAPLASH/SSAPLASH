# /api/ 요청은 Spring 앱으로 전달한다. 앱의 주소가 /api/...로 시작하므로 앞 경로를 자르지 않고 그대로 넘긴다.
# FastAPI는 컨테이너가 생기면 같은 방식으로 추가한다.
server {
    listen 80;
    server_name _;

    location /health {
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        # Docker 내부 DNS를 주기적으로 다시 조회한다. 앱 컨테이너가 재시작해 주소가 바뀌어도 따라간다.
        resolver 127.0.0.11 valid=10s;
        # 변수로 지정하면 요청 주소를 변경 없이 그대로 전달한다.
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        default_type text/plain;
        return 200 "infra up";
    }
}
