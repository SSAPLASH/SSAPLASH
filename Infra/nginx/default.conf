# 기본 combined 형식에서 Referer만 제외한다. 다른 경로로 이동할 때 콜백 주소가 접근 로그에 남지 않게 한다.
log_format without_referer '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "-" "$http_user_agent"';

# 콜백 이후 브라우저가 다른 경로에 인증 코드를 Referer로 보내지 않게 한다.
map $uri $response_referrer_policy {
    default strict-origin-when-cross-origin;
    ~^/api/auth/[^/]+/callback$ no-referrer;
}

# 80번: 인증서 발급·갱신 경로와 상태 확인만 처리하고, 나머지는 모두 https로 돌려보낸다.
server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log without_referer;

    # 인증서 발급·갱신용. Let's Encrypt가 이 경로로 들어와 "이 도메인의 주인"임을 확인한다.
    # 리다이렉트에서 예외로 둔다. 이 경로가 https로 넘어가면 갱신이 실패할 수 있다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 컨테이너 헬스체크와 배포 스크립트가 http로 호출한다. 리다이렉트하지 않는다.
    location ^~ /internal/ { return 404; }

    location /health {
        default_type text/plain;
        return 200 "ok";
    }

    # 쿼리에 인증 코드와 state가 포함되므로 접근·오류 로그를 남기지 않는다.
    location ~ ^/api/auth/[^/]+/callback$ {
        access_log off;
        error_log /dev/null;
        add_header Referrer-Policy no-referrer always;
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443번: 실제 서비스. /api/ 요청은 Spring 앱으로 전달한다. 앱의 주소가 /api/...로 시작하므로 앞 경로를 자르지 않고 그대로 넘긴다.
# FastAPI는 컨테이너가 생기면 같은 방식으로 추가한다.
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log without_referer;

    # 인증서와 개인 키. letsencrypt 볼륨에서 읽기 전용으로 읽는다. 갱신되면 nginx를 다시 읽어야 새 인증서가 적용된다.
    ssl_certificate     /etc/letsencrypt/live/k15a307.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k15a307.p.ssafy.io/privkey.pem;

    # TLS 1.0·1.1은 알려진 약점이 있어 쓰지 않는다. 암호 스위트는 Nginx 기본값을 쓴다(직접 고르면 실수하기 쉽다).
    ssl_protocols TLSv1.2 TLSv1.3;
    # 재접속 때 암호화 협상을 반복하지 않도록 결과를 잠시 기억한다. 세션 티켓은 키 교체 관리가 필요해 끈다.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 보안 헤더. 앞단 Nginx가 한 곳에서 붙인다.
    # 뒤쪽 서버(web, api)가 같은 헤더를 보내면 값이 두 번 나가므로 먼저 지우고 여기 값만 쓴다.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cross-Origin-Resource-Policy;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy $response_referrer_policy always;
    # CORP: 다른 사이트가 우리 응답을 <img>·<audio>·<script> 같은 태그로 끌어가지 못하게 한다(2026-11-04).
    # 같은 출처의 fetch와 CORS 요청, 브라우저가 아닌 클라이언트(GPU 워커)에는 영향이 없다. FE가 다른 사이트의 임베드·공유 미리보기가 없음을 확인했다.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # HSTS는 한 번 켜면 브라우저가 그 기간 동안 https만 쓰므로 되돌리기 어렵다. 5분으로 시작해 문제가 없으면 늘린다.
    # includeSubDomains와 preload는 쓰지 않는다. ssafy.io는 우리 도메인이 아니라 다른 서비스에 영향을 줄 수 있다.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # CSP를 차단 모드로 적용한다(2026-11-04). script-src에 'unsafe-inline'이 없어 XSS로 주입된 인라인 스크립트를 브라우저가 실행하지 않는다.
    # 개발자 도구 콘솔에 직접 입력한 코드는 CSP의 대상이 아니다(사용자가 스스로 하는 일이라 막지 않는다).
    # connect-src의 ws://localhost:*, ws://127.0.0.1:*는 스틱 브리지(FE WebSocketStickSource 기본 주소 ws://localhost:8765)용이다.
    # 브리지를 다른 PC의 주소로 쓰는 설정이 있으면 그 주소가 막히므로 FE와 확인한다(Infra/SECURITY.md 18절 확인 목록).
    # 문제가 생기면 아래 add_header 한 줄의 이름을 Content-Security-Policy-Report-Only로 되돌리면 차단이 풀린다.
    # /models/*는 HTML이 아니라 CSP가 필요 없어 location에 따로 적지 않았다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # GPU 서버의 공인 IP는 인증이 아니다. BE 워커 토큰으로 인증한다.
    # 연결 출발지 IP를 그대로 사용하며 IP가 바뀌면 이 허용 규칙을 갱신한다.
    location ^~ /internal/v1/chart-jobs/ {
        allow 222.107.238.74;
        deny all;
        client_max_body_size 8m;
        access_log off;
        error_log /dev/null;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LLM 총평 작업: 같은 GPU 서버가 BE에서 작업을 가져가는 경로다(docs/coach-narrative.md). 보호 방식은 위와 같고
    # 요청·응답이 작아(사실 JSON, 500자 이하 문장) 본문 한도는 64 KiB로 둔다. IP가 바뀌면 위 규칙과 함께 갱신한다.
    location ^~ /internal/v1/coach-narratives/ {
        allow 222.107.238.74;
        deny all;
        client_max_body_size 64k;
        access_log off;
        error_log /dev/null;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 연주 중 LLM 구간 코칭 워커(COACH-001, AI/docs/live-coach-llm.md). 총평 워커와 같은 GPU 서버 IP만 허용하고 BE 워커 토큰으로 인증한다.
    # 구간 사실(4 KiB 이하)과 짧은 문구만 오가서 본문 한도는 16 KiB로 둔다. IP가 바뀌면 위 규칙과 함께 갱신한다.
    location ^~ /internal/v1/live-coach-jobs/ {
        allow 222.107.238.74;
        deny all;
        client_max_body_size 16k;
        access_log off;
        error_log /dev/null;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /internal/ { return 404; }

    location /health {
        default_type text/plain;
        return 200 "ok";
    }

    location = /api/v1/songs/audio {
        client_max_body_size 51m;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 커버 multipart 요청만 2MiB 파일과 64KiB 부가 데이터를 허용한다.
    location ~ ^/api/v1/(?:admin/)?songs/[^/]+/cover$ {
        client_max_body_size 2112k;
        error_page 413 = @cover_too_large;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @cover_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"커버 이미지가 너무 큽니다.","status":413,"detail":"커버 이미지가 너무 큽니다.","code":"COVER_TOO_LARGE"}';
    }

    # MIDI 파일 상한과 multipart 부가 데이터를 허용한다.
    location ~ ^/api/v1/(?:songs/midi|admin/songs/midi|admin/songs/[^/]+/charts/midi)$ {
        client_max_body_size 1088k;
        error_page 413 = @midi_too_large;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # MusicXML 파일 상한(5 MiB)과 multipart 부가 데이터(64 KiB)를 허용한다.
    location = /api/v1/songs/musicxml {
        client_max_body_size 5184k;
        error_page 413 = @musicxml_too_large;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 관리자 반주 파일과 multipart 부가 데이터를 허용한다.
    location ~ ^/api/v1/admin/songs/[^/]+/accompaniment$ {
        client_max_body_size 51m;
        error_page 413 = @accompaniment_too_large;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 플레이 요약 JSON 한도를 적용한다.
    location = /api/v1/plays {
        client_max_body_size 5m;
        error_page 413 = @play_too_large;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 녹음 저장(JSON 최대 5MiB) 한도를 적용한다. 같은 경로의 GET(목록)은 본문이 없어 영향이 없다.
    # 상세·제목 변경·삭제(/api/v1/recordings/{id})는 본문이 작아 아래 /api/ 기본 한도를 그대로 쓴다.
    location = /api/v1/recordings {
        client_max_body_size 5m;
        error_page 413 = @recording_too_large;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 악보 등록 multipart 한도를 적용한다.
    location = /api/v1/sheets {
        client_max_body_size 51m;
        error_page 413 = @sheet_too_large;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @midi_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"MIDI 파일이 너무 큽니다.","status":413,"detail":"MIDI 파일이 너무 큽니다.","code":"MIDI_TOO_LARGE"}';
    }

    location @musicxml_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"MusicXML 파일이 너무 큽니다.","status":413,"detail":"MusicXML 파일이 너무 큽니다.","code":"MUSICXML_TOO_LARGE"}';
    }
    location @accompaniment_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"반주 파일이 너무 큽니다.","status":413,"detail":"반주 파일이 너무 큽니다.","code":"ACCOMPANIMENT_TOO_LARGE"}';
    }
    location @play_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"플레이 로그의 허용 크기를 초과했습니다.","status":413,"detail":"플레이 로그의 허용 크기를 초과했습니다.","code":"PLAY_UPLOAD_TOO_LARGE"}';
    }
    location @sheet_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"악보 파일이 너무 큽니다.","status":413,"detail":"악보 파일이 너무 큽니다.","code":"SHEET_TOO_LARGE"}';
    }
    # 제목·코드는 BE의 RecordingError.RECORDING_TOO_LARGE와 같다. FE는 code로 판별한다.
    location @recording_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"녹음이 너무 깁니다.","status":413,"detail":"녹음이 너무 깁니다.","code":"RECORDING_TOO_LARGE"}';
    }

    # 플레이 원본 요청만 기존 21MiB multipart 한도를 프록시에서도 허용한다.
    location ~ ^/api/v1/plays/[^/]+/raw$ {
        client_max_body_size 21m;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 채보 진행 WebSocket은 인증 메시지 전까지 작업 데이터를 보내지 않는다.
    location ^~ /ws/jobs/ {
        access_log off;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # API JSON 응답만 압축한다. BE는 응답 압축을 하지 않아 압축은 이 앞단 한 곳에서 한다(녹음 상세는 최대 약 3.5MB).
    # 프론트 정적 파일(js·css)은 FE 컨테이너(FE/nginx.conf)가 이미 압축하고, 프록시 응답에 Content-Encoding이 있으면 여기서 다시 압축하지 않는다.
    # 음원·이미지·모델은 이미 압축된 형식이라 gzip_types에 넣지 않는다(text/html은 Nginx가 항상 포함한다).
    # 토큰 응답은 gzip_min_length보다 작아 압축되지 않으므로 /api/auth/를 따로 빼지 않았다.
    gzip on;
    gzip_types application/json application/problem+json;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    # 인증 코드와 state가 포함된 콜백은 원본 접근·오류 로그에 기록하지 않는다.
    location ~ ^/api/auth/[^/]+/callback$ {
        access_log off;
        error_log /dev/null;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # Docker 내부 DNS를 주기적으로 다시 조회한다. 앱 컨테이너가 재시작해 주소가 바뀌어도 따라간다.
        resolver 127.0.0.11 valid=10s;
        # 변수로 지정하면 요청 주소를 변경 없이 그대로 전달한다.
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 이 서버 블록에서는 https가 전달된다. 앱이 https 요청임을 알 수 있다.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 분리 결과 staging은 입력 음원과 별도로 최대 128MiB까지 허용한다.
    location ^~ /airdrum-tmp-audio/worker-staging/ {
        access_log off;
        error_log /dev/null;
        resolver 127.0.0.11 valid=10s;
        set $s3_upstream http://seaweedfs:8333;
        proxy_pass $s3_upstream;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        client_max_body_size 128m;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # 서명 URL로 오는 스토리지 요청을 SeaweedFS로 전달한다. 서명에는 주소와 경로가 들어 있어서 경로를 자르거나 바꾸지 않는다.
    # 버킷 이름(첫 경로)으로 구분한다. airdrum-play-raw는 서버 내부 전용이라 여기에 넣지 않는다.
    location ~ ^/(airdrum-sheets|airdrum-accompaniments|airdrum-tmp-audio)/ {
        access_log off;
        error_log /dev/null;
        resolver 127.0.0.11 valid=10s;
        set $s3_upstream http://seaweedfs:8333;
        proxy_pass $s3_upstream;
        # 서명은 Host를 포함한다. 브라우저가 보낸 Host를 그대로 넘긴다.
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        # 음원·악보 업로드 크기에 맞춘 한도다. BE·AI와 정한 뒤 조정한다.
        client_max_body_size 50m;
        # 큰 파일을 서버 디스크에 쌓지 않고 바로 스토리지로 흘려 보낸다.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # 브라우저가 내려받는 모델 파일. mlflow의 게시 도구가 /models 볼륨에 쓰고 nginx는 읽기만 한다.
    # 매니페스트는 현재 버전을 가리키므로 캐시하지 않는다. 롤백이 바로 반영되어야 한다.
    location = /models/manifest.json {
        alias /usr/share/nginx/models/manifest.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
        # server 블록의 보안 헤더를 물려받지 못하므로 따로 적는다. 위쪽 값을 고치면 여기도 같이 고친다.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # 버전 폴더의 파일은 한 번 게시하면 바뀌지 않으므로 오래 캐시해도 된다. 목록은 보여 주지 않는다.
    location /models/ {
        alias /usr/share/nginx/models/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # server 블록의 보안 헤더를 물려받지 못하므로 따로 적는다. 위쪽 값을 고치면 여기도 같이 고친다.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # 그 밖의 모든 주소는 웹 화면(web 컨테이너)이 처리한다. 브라우저 라우터 주소(/play 등)도 여기서 index.html로 처리된다.
    # 위의 /health, /api/, 스토리지 경로, /models/는 이 위치보다 먼저 일치한다.
    location / {
        resolver 127.0.0.11 valid=10s;
        set $web_upstream http://web:8080;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
