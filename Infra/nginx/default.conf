# 80번: 인증서 발급·갱신 경로와 상태 확인만 처리하고, 나머지는 모두 https로 돌려보낸다.
server {
    listen 80;
    server_name _;

    # 인증서 발급·갱신용. Let's Encrypt가 이 경로로 들어와 "이 도메인의 주인"임을 확인한다.
    # 리다이렉트에서 예외로 둔다. 이 경로가 https로 넘어가면 갱신이 실패할 수 있다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 컨테이너 헬스체크와 배포 스크립트가 http로 호출한다. 리다이렉트하지 않는다.
    location ^~ /internal/ { return 404; }

    location /health {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443번: 실제 서비스. /api/ 요청은 Spring 앱으로 전달한다. 앱의 주소가 /api/...로 시작하므로 앞 경로를 자르지 않고 그대로 넘긴다.
# FastAPI는 컨테이너가 생기면 같은 방식으로 추가한다.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 인증서와 개인 키. letsencrypt 볼륨에서 읽기 전용으로 읽는다. 갱신되면 nginx를 다시 읽어야 새 인증서가 적용된다.
    ssl_certificate     /etc/letsencrypt/live/k15a307.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k15a307.p.ssafy.io/privkey.pem;

    # TLS 1.0·1.1은 알려진 약점이 있어 쓰지 않는다. 암호 스위트는 Nginx 기본값을 쓴다(직접 고르면 실수하기 쉽다).
    ssl_protocols TLSv1.2 TLSv1.3;
    # 재접속 때 암호화 협상을 반복하지 않도록 결과를 잠시 기억한다. 세션 티켓은 키 교체 관리가 필요해 끈다.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # HSTS는 아직 켜지 않는다. 한 번 켜면 브라우저가 오래 https만 쓰게 되어 되돌리기 어렵다. https가 안정된 뒤 따로 켠다.

    location ^~ /internal/ { return 404; }

    location /health {
        default_type text/plain;
        return 200 "ok";
    }

    location = /api/v1/songs/audio {
        client_max_body_size 51m;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 커버 multipart 요청만 2MiB 파일과 64KiB 부가 데이터를 허용한다.
    location ~ ^/api/v1/songs/[^/]+/cover$ {
        client_max_body_size 2112k;
        error_page 413 = @cover_too_large;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @cover_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"커버 이미지가 너무 큽니다.","status":413,"detail":"커버 이미지가 너무 큽니다.","code":"COVER_TOO_LARGE"}';
    }

    # 플레이 원본 요청만 기존 21MiB multipart 한도를 프록시에서도 허용한다.
    location ~ ^/api/v1/plays/[^/]+/raw$ {
        client_max_body_size 21m;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 채보 진행 WebSocket은 인증 메시지 전까지 작업 데이터를 보내지 않는다.
    location ^~ /ws/jobs/ {
        access_log off;
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /api/ {
        # Docker 내부 DNS를 주기적으로 다시 조회한다. 앱 컨테이너가 재시작해 주소가 바뀌어도 따라간다.
        resolver 127.0.0.11 valid=10s;
        # 변수로 지정하면 요청 주소를 변경 없이 그대로 전달한다.
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 이 서버 블록에서는 https가 전달된다. 앱이 https 요청임을 알 수 있다.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 분리 결과 staging은 입력 음원과 별도로 최대 128MiB까지 허용한다.
    location ^~ /airdrum-tmp-audio/worker-staging/ {
        resolver 127.0.0.11 valid=10s;
        set $s3_upstream http://seaweedfs:8333;
        proxy_pass $s3_upstream;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        client_max_body_size 128m;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # 서명 URL로 오는 스토리지 요청을 SeaweedFS로 전달한다. 서명에는 주소와 경로가 들어 있어서 경로를 자르거나 바꾸지 않는다.
    # 버킷 이름(첫 경로)으로 구분한다. airdrum-play-raw는 서버 내부 전용이라 여기에 넣지 않는다.
    location ~ ^/(airdrum-sheets|airdrum-accompaniments|airdrum-tmp-audio)/ {
        resolver 127.0.0.11 valid=10s;
        set $s3_upstream http://seaweedfs:8333;
        proxy_pass $s3_upstream;
        # 서명은 Host를 포함한다. 브라우저가 보낸 Host를 그대로 넘긴다.
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        # 음원·악보 업로드 크기에 맞춘 한도다. BE·AI와 정한 뒤 조정한다.
        client_max_body_size 50m;
        # 큰 파일을 서버 디스크에 쌓지 않고 바로 스토리지로 흘려 보낸다.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # 브라우저가 내려받는 모델 파일. mlflow의 게시 도구가 /models 볼륨에 쓰고 nginx는 읽기만 한다.
    # 매니페스트는 현재 버전을 가리키므로 캐시하지 않는다. 롤백이 바로 반영되어야 한다.
    location = /models/manifest.json {
        alias /usr/share/nginx/models/manifest.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # 버전 폴더의 파일은 한 번 게시하면 바뀌지 않으므로 오래 캐시해도 된다. 목록은 보여 주지 않는다.
    location /models/ {
        alias /usr/share/nginx/models/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 그 밖의 모든 주소는 웹 화면(web 컨테이너)이 처리한다. 브라우저 라우터 주소(/play 등)도 여기서 index.html로 처리된다.
    # 위의 /health, /api/, 스토리지 경로, /models/는 이 위치보다 먼저 일치한다.
    location / {
        resolver 127.0.0.11 valid=10s;
        set $web_upstream http://web:8080;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
