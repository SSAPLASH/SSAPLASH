# 핵심 서비스 기본 구성이다. 공개 진입점은 nginx 하나이고 DB·Redis는 내부 네트워크에서만 접근한다.
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 게시된 모델 파일과 매니페스트. nginx는 읽기만 하고 쓰기는 mlflow의 게시 도구가 한다.
      - models:/usr/share/nginx/models:ro
    networks:
      - public
      - internal
    mem_limit: 64m
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:2.30.2-pg16
    # 기존 볼륨에서도 확장을 preload한다. 운영 전환 전 백업·복원 검증이 필요하다.
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    networks:
      - internal
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  api:
    build:
      context: ../BE
    environment:
      # DB는 postgres 서비스의 값에서 파생한다. 비밀번호를 .env 한 곳에서만 관리하기 위해서다.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 로그인 토큰 서명 키. 없으면 앱이 기동하지 않는다. 배포마다 바꾸지 말고 고정한다.
      JWT_SECRET: ${JWT_SECRET:?Infra/.env에 JWT_SECRET을 지정하세요}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SSAFY_CLIENT_ID: ${SSAFY_CLIENT_ID:-}
      SSAFY_CLIENT_SECRET: ${SSAFY_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # 오브젝트 스토리지(SeaweedFS). 켜는 스위치는 .env에서 정하며 기본은 꺼짐이다.
      # 악보·반주는 읽기용 키로 서명 URL을 만든다. 공개 주소는 브라우저가 접속하는 도메인 루트다.
      CHART_ASSET_ENABLED: ${CHART_ASSET_ENABLED:-false}
      CHART_ASSET_ENDPOINT: http://seaweedfs:8333
      CHART_ASSET_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_URL:-}
      CHART_ASSET_REGION: us-east-1
      CHART_ASSET_SHEET_BUCKET: airdrum-sheets
      CHART_ASSET_ACCOMPANIMENT_BUCKET: airdrum-accompaniments
      CHART_ASSET_ACCESS_KEY: ${OBJECT_STORAGE_READ_ACCESS_KEY:-}
      CHART_ASSET_SECRET_KEY: ${OBJECT_STORAGE_READ_SECRET_KEY:-}
      # 플레이 원본은 서버 내부 주소로만 접근한다. 쓰기용 키를 쓰고 버킷은 외부에 전달하지 않는다(nginx 제외).
      PLAY_RAW_ENABLED: ${PLAY_RAW_ENABLED:-false}
      PLAY_RAW_ENDPOINT: http://seaweedfs:8333
      PLAY_RAW_REGION: us-east-1
      PLAY_RAW_BUCKET: airdrum-play-raw
      PLAY_RAW_ACCESS_KEY: ${OBJECT_STORAGE_WRITE_ACCESS_KEY:-}
      PLAY_RAW_SECRET_KEY: ${OBJECT_STORAGE_WRITE_SECRET_KEY:-}
      PLAY_RAW_PRIVATE_BUCKET_CONFIRMED: "true"
      # 운영에서는 API 문서를 닫는다.
      SWAGGER_ENABLED: "false"
      # 컨테이너 메모리(768m)의 일부만 힙으로 쓰도록 비율로 지정한다.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 버킷이 만들어진 뒤에 시작한다. 초기화는 일회성이라 끝나면 종료한다.
      seaweedfs-init:
        condition: service_completed_successfully
    # 소셜 로그인 제공자(Google·SSAFY)에 앱이 직접 접속하므로 외부 접속이 되는 public에도 붙인다.
    # 포트는 공개하지 않는다. 외부 진입점은 계속 nginx 하나다.
    networks:
      - public
      - internal
    mem_limit: 768m
    # readiness는 DB만 본다. /actuator/health는 Redis까지 봐서 Redis 장애에도 앱을 재시작시킬 수 있어 쓰지 않는다.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    # 앱은 SIGTERM을 받으면 최대 20초까지 처리 중인 요청을 기다린다.
    stop_grace_period: 30s
    restart: unless-stopped

  # S3 호환 오브젝트 스토리지. AWS 콘솔을 쓸 수 없어 SeaweedFS로 대신한다. 포트는 공개하지 않는다.
  # 브라우저는 nginx를 거쳐 서명 URL로 접근하고, 앱은 내부 주소(seaweedfs:8333)로 접근한다.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # 접근 키는 .env에서 읽어 시작할 때 S3 설정 파일로 만든다. 키 값이 저장소에 남지 않는다.
    # reader: 악보·반주 버킷 읽기만(서명 URL 발급용). writer: 서버 내부 적재·플레이 원본·임시 음원용.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"reader","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:airdrum-sheets","List:airdrum-sheets","Read:airdrum-accompaniments","List:airdrum-accompaniments"]},{"name":"writer","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read","Write","List","Tagging"]}]}' "$$OBJECT_STORAGE_READ_ACCESS_KEY" "$$OBJECT_STORAGE_READ_SECRET_KEY" "$$OBJECT_STORAGE_WRITE_ACCESS_KEY" "$$OBJECT_STORAGE_WRITE_SECRET_KEY" > /tmp/s3.json
        # volume.max=0은 디스크 여유에 맞춰 볼륨 수를 자동으로 정한다. 버킷마다 볼륨이 여러 개 잡히고 TTL 경로는 전용 볼륨이 더 필요해 고정 값은 부족해진다.
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json -s3.externalUrl="$$OBJECT_STORAGE_PUBLIC_URL" -s3.allowedOrigins="$$OBJECT_STORAGE_PUBLIC_URL" -volume.max=0 -master.volumeSizeLimitMB=1024
    environment:
      OBJECT_STORAGE_READ_ACCESS_KEY: ${OBJECT_STORAGE_READ_ACCESS_KEY:?Infra/.env에 OBJECT_STORAGE_READ_ACCESS_KEY를 지정하세요}
      OBJECT_STORAGE_READ_SECRET_KEY: ${OBJECT_STORAGE_READ_SECRET_KEY:?Infra/.env에 OBJECT_STORAGE_READ_SECRET_KEY를 지정하세요}
      OBJECT_STORAGE_WRITE_ACCESS_KEY: ${OBJECT_STORAGE_WRITE_ACCESS_KEY:?Infra/.env에 OBJECT_STORAGE_WRITE_ACCESS_KEY를 지정하세요}
      OBJECT_STORAGE_WRITE_SECRET_KEY: ${OBJECT_STORAGE_WRITE_SECRET_KEY:?Infra/.env에 OBJECT_STORAGE_WRITE_SECRET_KEY를 지정하세요}
      # 서명 URL의 공개 주소. 프록시(nginx) 뒤에서도 이 주소 기준으로 서명을 검증한다. 허용 출처도 이 주소로 좁힌다.
      OBJECT_STORAGE_PUBLIC_URL: ${OBJECT_STORAGE_PUBLIC_URL:?Infra/.env에 OBJECT_STORAGE_PUBLIC_URL을 지정하세요}
    volumes:
      - seaweeddata:/data
    networks:
      - internal
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # 버킷과 만료 정책을 만드는 일회성 작업이다. 여러 번 실행해도 결과가 같고 끝나면 종료한다.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sh_run() { echo "$$1" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888; }
        existing=$$(sh_run "s3.bucket.list")
        for b in airdrum-sheets airdrum-accompaniments airdrum-play-raw airdrum-tmp-audio airdrum-mlflow; do
          # 이미 있는 버킷은 건너뛴다. 다시 실행해도 결과가 같다.
          echo "$$existing" | grep -q "$$b" || sh_run "s3.bucket.create -name $$b"
        done
        # 임시 음원은 처리 후 즉시 폐기가 원칙이고, 이 TTL은 지우지 못했을 때를 위한 보험이다(1일).
        sh_run "fs.configure -locationPrefix=/buckets/airdrum-tmp-audio/ -ttl=1d -apply"
        echo "== 만들어진 버킷"
        sh_run "s3.bucket.list"
    networks:
      - internal
    mem_limit: 256m
    restart: "no"

  # MLflow가 쓸 DB를 기존 PostgreSQL에 만든다. 앱 DB와 분리해 마이그레이션이 섞이지 않게 한다.
  # 이미 있으면 건너뛰고 끝나면 종료하는 일회성 작업이다(기존 볼륨에는 초기화 스크립트가 다시 실행되지 않아서 이 방식을 쓴다).
  mlflow-db-init:
    image: timescale/timescaledb:2.30.2-pg16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if psql -h postgres -U "${POSTGRES_USER}" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='mlflow'" | grep -q 1; then
          echo "mlflow DB가 이미 있습니다."
        else
          psql -h postgres -U "${POSTGRES_USER}" -d postgres -c "CREATE DATABASE mlflow"
        fi
    networks:
      - internal
    mem_limit: 128m
    restart: "no"

  # 실험 기록과 모델 레지스트리. 외부에 공개하지 않는다(UI에 인증이 없다).
  # 서버의 127.0.0.1:5000에만 열고 팀원은 SSH 터널(ssh -L 5000:localhost:5000)로 접속한다.
  # 호스트에 포트를 열려면 internal이 아닌 네트워크가 필요해서 public에도 붙인다. 호스트 공개 범위는 루프백뿐이다.
  mlflow:
    build:
      context: ./mlflow
    # 아티팩트는 서버를 거쳐 저장한다(--serve-artifacts). 클라이언트가 스토리지 키를 가질 필요가 없다.
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      - --artifacts-destination
      - s3://airdrum-mlflow
      - --serve-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_WRITE_ACCESS_KEY:?Infra/.env에 OBJECT_STORAGE_WRITE_ACCESS_KEY를 지정하세요}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_WRITE_SECRET_KEY:?Infra/.env에 OBJECT_STORAGE_WRITE_SECRET_KEY를 지정하세요}
      AWS_DEFAULT_REGION: us-east-1
      # 게시 도구(publish-model)가 같은 컨테이너의 서버에 접속한다.
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
    depends_on:
      postgres:
        condition: service_healthy
      mlflow-db-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - models:/models
    networks:
      - public
      - internal
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

networks:
  public: {}
  internal:
    internal: true

volumes:
  pgdata:
  redisdata:
  seaweeddata:
  models:
