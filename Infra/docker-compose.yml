# 핵심 서비스 기본 구성이다. 공개 진입점은 nginx 하나이고 DB·Redis는 내부 네트워크에서만 접근한다.

# 모든 서비스의 컨테이너 로그 크기를 제한한다. 로그 파일이 서버 디스크를 채우지 않게 하는 한도다.
# 장기 보관과 검색은 Loki가 맡는다(Infra/monitoring/README.md).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      # https. 인증서는 letsencrypt 볼륨에서 읽는다(서버에서 먼저 발급해야 nginx가 시작한다).
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 게시된 모델 파일과 매니페스트. nginx는 읽기만 하고 쓰기는 mlflow의 게시 도구가 한다.
      - models:/usr/share/nginx/models:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    networks:
      - public
      - internal
    mem_limit: 64m
    # 안에서 /health를 호출한다. 서비스의 유일한 입구라 상태를 보이게 한다.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: timescale/timescaledb:2.30.2-pg16
    # 기존 볼륨에서도 확장을 preload한다. 운영 전환 전 백업·복원 검증이 필요하다.
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    # 비밀번호를 명령줄 인자(--requirepass)로 넘기면 `docker top`·`ps`에 그대로 보인다. 설정 파일(권한 600)에 쓰고 파일 경로만 넘긴다.
    # 이미지의 시작 스크립트를 거쳐야 redis 사용자로 내려가 실행되므로(root 방지) `exec docker-entrypoint.sh`로 호출한다.
    command:
      - sh
      - -c
      - umask 077 && printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf && chown redis:redis /tmp/redis.conf && exec docker-entrypoint.sh redis-server /tmp/redis.conf
    volumes:
      - redisdata:/data
    networks:
      - internal
    mem_limit: 128m
    healthcheck:
      # `-a 비밀번호`는 명령줄에 남으므로 환경변수 REDISCLI_AUTH로 넘긴다.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    logging: *default-logging

  api:
    build:
      context: ../BE
    environment:
      # DB는 postgres 서비스의 값에서 파생한다. 비밀번호를 .env 한 곳에서만 관리하기 위해서다.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 로그인 토큰 서명 키. 없으면 앱이 기동하지 않는다. 배포마다 바꾸지 말고 고정한다.
      JWT_SECRET: ${JWT_SECRET:?Infra/.env에 JWT_SECRET을 지정하세요}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SSAFY_CLIENT_ID: ${SSAFY_CLIENT_ID:-}
      SSAFY_CLIENT_SECRET: ${SSAFY_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # 가입 동의로 저장할 수 있는 약관·개인정보·데이터 활용 안내의 허용 판(쉼표 구분). 비어 있으면 검사하지 않는다(BE README).
      SIGNUP_CONSENT_TERMS_VERSIONS: ${SIGNUP_CONSENT_TERMS_VERSIONS:-}
      SIGNUP_CONSENT_PRIVACY_VERSIONS: ${SIGNUP_CONSENT_PRIVACY_VERSIONS:-}
      SIGNUP_CONSENT_DATA_VERSIONS: ${SIGNUP_CONSENT_DATA_VERSIONS:-}
      SIGNUP_CONSENT_RECOMMENDATION_VERSIONS: ${SIGNUP_CONSENT_RECOMMENDATION_VERSIONS:-}
      # 곡 추천 R3. 기본은 모두 꺼짐이고 꺼져 있으면 R1과 같다. 켜는 절차는 Infra/README.md.
      RECOMMEND_R3_ENABLED: ${RECOMMEND_R3_ENABLED:-false}
      RECOMMEND_R3_ROLLOUT_PERCENT: ${RECOMMEND_R3_ROLLOUT_PERCENT:-0}
      RECOMMEND_R3_ACCEPTED_MODEL_VERSIONS: ${RECOMMEND_R3_ACCEPTED_MODEL_VERSIONS:-}
      # 연주 중 LLM 구간 코칭. 기본 꺼짐. 상한은 GPU를 지키는 값이다(AI/docs/live-coach-llm.md).
      LIVE_COACH_LLM_ENABLED: ${LIVE_COACH_LLM_ENABLED:-false}
      LIVE_COACH_LLM_PER_RUN: ${LIVE_COACH_LLM_PER_RUN:-10}
      LIVE_COACH_LLM_PER_MINUTE: ${LIVE_COACH_LLM_PER_MINUTE:-6}
      LIVE_COACH_HABIT_ENABLED: ${LIVE_COACH_HABIT_ENABLED:-false}
      # 오브젝트 스토리지(SeaweedFS). 켜는 스위치는 .env에서 정하며 기본은 꺼짐이다.
      # 악보·반주는 읽기용 키로 서명 URL을 만든다. 공개 주소는 브라우저가 접속하는 도메인 루트다.
      CHART_ASSET_ENABLED: ${CHART_ASSET_ENABLED:-false}
      CHART_ASSET_ENDPOINT: http://seaweedfs:8333
      CHART_ASSET_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_URL:-}
      CHART_ASSET_REGION: us-east-1
      CHART_ASSET_SHEET_BUCKET: airdrum-sheets
      CHART_ASSET_ACCOMPANIMENT_BUCKET: airdrum-accompaniments
      CHART_ASSET_ACCESS_KEY: ${OBJECT_STORAGE_READ_ACCESS_KEY:-}
      CHART_ASSET_SECRET_KEY: ${OBJECT_STORAGE_READ_SECRET_KEY:-}
      # 플레이 원본은 서버 내부 주소로만 접근한다. 쓰기용 키를 쓰고 버킷은 외부에 전달하지 않는다(nginx 제외).
      PLAY_RAW_ENABLED: ${PLAY_RAW_ENABLED:-false}
      PLAY_RAW_ENDPOINT: http://seaweedfs:8333
      PLAY_RAW_REGION: us-east-1
      PLAY_RAW_BUCKET: airdrum-play-raw
      PLAY_RAW_ACCESS_KEY: ${OBJECT_STORAGE_WRITE_ACCESS_KEY:-}
      PLAY_RAW_SECRET_KEY: ${OBJECT_STORAGE_WRITE_SECRET_KEY:-}
      PLAY_RAW_PRIVATE_BUCKET_CONFIRMED: "true"
      # 음원 원본은 별도로 확인한 비공개 비버전 버킷에 저장한다. 기본 비활성이다.
      AUDIO_STORAGE_ENABLED: ${AUDIO_STORAGE_ENABLED:-false}
      AUDIO_STORAGE_ENDPOINT: http://seaweedfs:8333
      AUDIO_STORAGE_PUBLIC_ENDPOINT: ${AUDIO_STORAGE_PUBLIC_ENDPOINT:-${OBJECT_STORAGE_PUBLIC_URL:?Infra/.env에 OBJECT_STORAGE_PUBLIC_URL을 지정하세요}}
      CHART_WORKER_CREDENTIALS: ${CHART_WORKER_CREDENTIALS:-}
      CHART_JOBS_WEBSOCKET_ALLOWED_ORIGINS: ${CHART_JOBS_WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AUDIO_STORAGE_REGION: us-east-1
      AUDIO_STORAGE_BUCKET: ${AUDIO_STORAGE_BUCKET:-}
      AUDIO_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_WRITE_ACCESS_KEY:-}
      AUDIO_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_WRITE_SECRET_KEY:-}
      AUDIO_STORAGE_PRIVATE_BUCKET_CONFIRMED: ${AUDIO_STORAGE_PRIVATE_BUCKET_CONFIRMED:-false}
      # MIDI 원본은 1일 만료 버킷과 분리한다. 실제 비공개 권한 확인 뒤 활성화한다.
      MIDI_STORAGE_ENABLED: ${MIDI_STORAGE_ENABLED:-false}
      MIDI_STORAGE_ENDPOINT: http://seaweedfs:8333
      MIDI_STORAGE_REGION: us-east-1
      MIDI_STORAGE_BUCKET: airdrum-midi-originals
      MIDI_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_WRITE_ACCESS_KEY:-}
      MIDI_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_WRITE_SECRET_KEY:-}
      MIDI_STORAGE_PRIVATE_BUCKET_CONFIRMED: ${MIDI_STORAGE_PRIVATE_BUCKET_CONFIRMED:-false}
      # 운영에서는 API 문서를 닫는다.
      SWAGGER_ENABLED: "false"
      # 컨테이너 메모리(768m)의 일부만 힙으로 쓰도록 비율로 지정한다.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
      # 약점 구간 분석(AI 서버) 주소. 내부 네트워크에서만 호출한다. BE는 호출 실패 시 리포트를 정상 제공한다.
      AI_ANALYSIS_BASE_URL: ${AI_ANALYSIS_BASE_URL:-http://ai-api:8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 버킷이 만들어진 뒤에 시작한다. 초기화는 일회성이라 끝나면 종료한다.
      seaweedfs-init:
        condition: service_completed_successfully
    # 소셜 로그인 제공자(Google·SSAFY)에 앱이 직접 접속하므로 외부 접속이 되는 public에도 붙인다.
    # 포트는 공개하지 않는다. 외부 진입점은 계속 nginx 하나다.
    networks:
      - public
      - internal
    mem_limit: 768m
    # readiness는 DB만 본다. /actuator/health는 Redis까지 봐서 Redis 장애에도 앱을 재시작시킬 수 있어 쓰지 않는다.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    # 앱은 SIGTERM을 받으면 최대 20초까지 처리 중인 요청을 기다린다.
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # 별도 CPU 프로세스. DB·스토리지 전용 계정은 운영에서 최소 권한으로 준비한다.
  midi-worker:
    profiles: ["midi-worker"]
    build:
      context: ../BE
      dockerfile: Dockerfile.midi-worker
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${MIDI_WORKER_DB_USERNAME:-}
      DB_PASSWORD: ${MIDI_WORKER_DB_PASSWORD:-}
      MIDI_STORAGE_ENABLED: ${MIDI_STORAGE_ENABLED:-false}
      MIDI_STORAGE_PRIVATE_BUCKET_CONFIRMED: ${MIDI_STORAGE_PRIVATE_BUCKET_CONFIRMED:-false}
      MIDI_STORAGE_ENDPOINT: http://seaweedfs:8333
      MIDI_STORAGE_REGION: us-east-1
      MIDI_STORAGE_BUCKET: airdrum-midi-originals
      MIDI_STORAGE_ACCESS_KEY: ${MIDI_WORKER_STORAGE_ACCESS_KEY:-}
      MIDI_STORAGE_SECRET_KEY: ${MIDI_WORKER_STORAGE_SECRET_KEY:-}
      CHART_ASSET_ENABLED: ${CHART_ASSET_ENABLED:-false}
      CHART_ASSET_ENDPOINT: http://seaweedfs:8333
      CHART_ASSET_REGION: us-east-1
      CHART_ASSET_ACCOMPANIMENT_BUCKET: airdrum-accompaniments
      WORKER_STORAGE_ACCOMPANIMENT_WRITE_ACCESS_KEY: ${MIDI_WORKER_STORAGE_ACCESS_KEY:-}
      WORKER_STORAGE_ACCOMPANIMENT_WRITE_SECRET_KEY: ${MIDI_WORKER_STORAGE_SECRET_KEY:-}
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    depends_on:
      api:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    networks: [internal]
    cpus: 1.0
    mem_limit: 2g
    tmpfs:
      - /tmp/midi:rw,noexec,nosuid,size=1g,uid=10001,gid=10001
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging

  # S3 호환 오브젝트 스토리지. AWS 콘솔을 쓸 수 없어 SeaweedFS로 대신한다. 포트는 공개하지 않는다.
  # 브라우저는 nginx를 거쳐 서명 URL로 접근하고, 앱은 내부 주소(seaweedfs:8333)로 접근한다.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # 접근 키는 .env에서 읽어 시작할 때 S3 설정 파일로 만든다. 키 값이 저장소에 남지 않는다.
    # reader: 악보·반주 버킷 읽기만(서명 URL 발급용). writer: 서버 내부 적재·플레이 원본·임시 음원용.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"reader","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:airdrum-sheets","List:airdrum-sheets","Read:airdrum-accompaniments","List:airdrum-accompaniments"]},{"name":"writer","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read","Write","List","Tagging"]}' "$$OBJECT_STORAGE_READ_ACCESS_KEY" "$$OBJECT_STORAGE_READ_SECRET_KEY" "$$OBJECT_STORAGE_WRITE_ACCESS_KEY" "$$OBJECT_STORAGE_WRITE_SECRET_KEY" > /tmp/s3.json
        if [ -n "$$MIDI_WORKER_STORAGE_ACCESS_KEY" ] || [ -n "$$MIDI_WORKER_STORAGE_SECRET_KEY" ]; then
          if [ -z "$$MIDI_WORKER_STORAGE_ACCESS_KEY" ] || [ -z "$$MIDI_WORKER_STORAGE_SECRET_KEY" ] || [ "$$MIDI_WORKER_STORAGE_ACCESS_KEY" = "$$OBJECT_STORAGE_WRITE_ACCESS_KEY" ] || [ "$$MIDI_WORKER_STORAGE_ACCESS_KEY" = "$$OBJECT_STORAGE_READ_ACCESS_KEY" ]; then
            echo "MIDI 워커 저장소 자격증명은 별도 쌍으로 설정해야 합니다." >&2; exit 1
          fi
          printf ',{"name":"midi-worker","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:airdrum-midi-originals","List:airdrum-midi-originals","Read:airdrum-accompaniments","Write:airdrum-accompaniments","List:airdrum-accompaniments"]}' "$$MIDI_WORKER_STORAGE_ACCESS_KEY" "$$MIDI_WORKER_STORAGE_SECRET_KEY" >> /tmp/s3.json
        fi
        printf ']}' >> /tmp/s3.json
        # volume.max=0은 디스크 여유에 맞춰 볼륨 수를 자동으로 정한다. 버킷마다 볼륨이 여러 개 잡히고 TTL 경로는 전용 볼륨이 더 필요해 고정 값은 부족해진다.
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json -s3.externalUrl="$$OBJECT_STORAGE_PUBLIC_URL" -s3.allowedOrigins="$$OBJECT_STORAGE_PUBLIC_URL" -volume.max=0 -master.volumeSizeLimitMB=1024
    environment:
      OBJECT_STORAGE_READ_ACCESS_KEY: ${OBJECT_STORAGE_READ_ACCESS_KEY:?Infra/.env에 OBJECT_STORAGE_READ_ACCESS_KEY를 지정하세요}
      OBJECT_STORAGE_READ_SECRET_KEY: ${OBJECT_STORAGE_READ_SECRET_KEY:?Infra/.env에 OBJECT_STORAGE_READ_SECRET_KEY를 지정하세요}
      OBJECT_STORAGE_WRITE_ACCESS_KEY: ${OBJECT_STORAGE_WRITE_ACCESS_KEY:?Infra/.env에 OBJECT_STORAGE_WRITE_ACCESS_KEY를 지정하세요}
      OBJECT_STORAGE_WRITE_SECRET_KEY: ${OBJECT_STORAGE_WRITE_SECRET_KEY:?Infra/.env에 OBJECT_STORAGE_WRITE_SECRET_KEY를 지정하세요}
      MIDI_WORKER_STORAGE_ACCESS_KEY: ${MIDI_WORKER_STORAGE_ACCESS_KEY:-}
      MIDI_WORKER_STORAGE_SECRET_KEY: ${MIDI_WORKER_STORAGE_SECRET_KEY:-}
      # 서명 URL의 공개 주소. 프록시(nginx) 뒤에서도 이 주소 기준으로 서명을 검증한다. 허용 출처도 이 주소로 좁힌다.
      OBJECT_STORAGE_PUBLIC_URL: ${OBJECT_STORAGE_PUBLIC_URL:?Infra/.env에 OBJECT_STORAGE_PUBLIC_URL을 지정하세요}
    volumes:
      - seaweeddata:/data
    networks:
      - internal
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  # 버킷과 만료 정책을 만드는 일회성 작업이다. 여러 번 실행해도 결과가 같고 끝나면 종료한다.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sh_run() { echo "$$1" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888; }
        existing=$$(sh_run "s3.bucket.list")
        for b in airdrum-sheets airdrum-accompaniments airdrum-play-raw airdrum-tmp-audio airdrum-midi-originals airdrum-mlflow; do
          # 이미 있는 버킷은 건너뛴다. 다시 실행해도 결과가 같다.
          echo "$$existing" | grep -q "$$b" || sh_run "s3.bucket.create -name $$b"
        done
        # 임시 음원은 처리 후 즉시 폐기가 원칙이고, 이 TTL은 지우지 못했을 때를 위한 보험이다(1일).
        sh_run "fs.configure -locationPrefix=/buckets/airdrum-tmp-audio/ -ttl=1d -apply"
        echo "== 만들어진 버킷"
        sh_run "s3.bucket.list"
    networks:
      - internal
    mem_limit: 256m
    restart: "no"
    logging: *default-logging

  # ---- 모니터링·로그 (설정은 Infra/monitoring/) ----
  # 지표 저장소. 포트를 열지 않는다. 보관은 15일 또는 5GB 중 먼저 닿는 쪽이다.
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - internal
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  # 서버(호스트)의 CPU·메모리·디스크 지표. 호스트 파일 시스템을 읽기 전용으로만 본다.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks:
      - internal
    mem_limit: 64m
    # /metrics는 수집이 무거워서 안내 화면(/)으로 확인한다.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9100/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  # 컨테이너별 지표. 호스트의 컨테이너 정보를 읽기 전용으로 본다.
  # gcr.io 이미지라 서버에서 받아지는지 처음에 확인한다(Infra/monitoring/README.md).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - internal
    mem_limit: 256m
    logging: *default-logging
    restart: unless-stopped

  # 로그 저장소. 포트를 열지 않는다. 보관 기간은 설정 파일에서 7일이다.
  # 헬스체크가 없다: 이 이미지는 쉘과 wget·curl이 없어서 컨테이너 안에서 실행하는 헬스체크를 만들 수 없다.
  # Loki 상태는 Grafana의 로그 조회와 알림으로 본다(Infra/monitoring/README.md).
  loki:
    image: grafana/loki:3.7.9
    command:
      - -config.file=/etc/loki/config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - internal
    mem_limit: 512m
    logging: *default-logging
    restart: unless-stopped

  # 컨테이너 로그를 모아 Loki로 보낸다. 서비스 이름으로 구분하려면 Docker 소켓이 필요하다.
  # 주의: Docker 소켓은 사실상 서버 전체 권한이다. 읽기 전용(:ro)으로 마운트해도 API 호출은 막히지 않는다.
  # 그래서 포트를 열지 않고 내부 네트워크에만 두며 이미지 버전을 고정한다(Infra/monitoring/README.md).
  alloy:
    image: grafana/alloy:v1.21.2
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - internal
    mem_limit: 256m
    # 이미지에 wget·curl이 없어서 bash의 /dev/tcp로 12345번에 접속해 /-/ready 응답(200)을 확인한다.
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/12345; printf "GET /-/ready HTTP/1.0\r\n\r\n" >&3; head -1 <&3 | grep -q " 200 "']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  # 지표와 로그를 한 화면에서 본다. 외부에 공개하지 않는다.
  # 서버의 127.0.0.1:3000에만 열고 팀원은 SSH 터널(ssh -L 3000:localhost:3000)로 접속한다.
  # 호스트에 포트를 열려면 internal이 아닌 네트워크가 필요해서 public에도 붙인다. 호스트 공개 범위는 루프백뿐이다.
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Infra/.env에 GRAFANA_ADMIN_PASSWORD를 지정하세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - public
      - internal
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  # MLflow가 쓸 DB를 기존 PostgreSQL에 만든다. 앱 DB와 분리해 마이그레이션이 섞이지 않게 한다.
  # 이미 있으면 건너뛰고 끝나면 종료하는 일회성 작업이다(기존 볼륨에는 초기화 스크립트가 다시 실행되지 않아서 이 방식을 쓴다).
  mlflow-db-init:
    image: timescale/timescaledb:2.30.2-pg16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if psql -h postgres -U "${POSTGRES_USER}" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='mlflow'" | grep -q 1; then
          echo "mlflow DB가 이미 있습니다."
        else
          psql -h postgres -U "${POSTGRES_USER}" -d postgres -c "CREATE DATABASE mlflow"
        fi
    networks:
      - internal
    mem_limit: 128m
    restart: "no"
    logging: *default-logging

  # 실험 기록과 모델 레지스트리. 외부에 공개하지 않는다(UI에 인증이 없다).
  # 서버의 127.0.0.1:5000에만 열고 팀원은 SSH 터널(ssh -L 5000:localhost:5000)로 접속한다.
  # 호스트에 포트를 열려면 internal이 아닌 네트워크가 필요해서 public에도 붙인다. 호스트 공개 범위는 루프백뿐이다.
  mlflow:
    build:
      context: ./mlflow
    # 아티팩트는 서버를 거쳐 저장한다(--serve-artifacts). 클라이언트가 스토리지 키를 가질 필요가 없다.
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      # DB 주소(비밀번호 포함)는 명령줄이 아니라 아래 environment의 MLFLOW_BACKEND_STORE_URI로 넘긴다.
      # 명령줄에 두면 `docker top`·`ps`에 비밀번호가 그대로 보인다.
      - --artifacts-destination
      - s3://airdrum-mlflow
      - --serve-artifacts
      # 웹 서버 워커는 1개로 충분하다(트래픽이 적다).
      - --workers
      - "1"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      # MLflow 3.x의 작업 실행기(huey 프로세스 약 120개, 메모리 1.6GiB)를 끈다. 이 서버는 실험 기록과 모델 저장만 하고 작업 큐가 필요 없다.
      # 켜 두면 시작 직후 자원을 몰아 쓰며 컨테이너가 11초마다 재시작을 반복했다(Infra/TROUBLESHOOTING.md C10).
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_WRITE_ACCESS_KEY:?Infra/.env에 OBJECT_STORAGE_WRITE_ACCESS_KEY를 지정하세요}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_WRITE_SECRET_KEY:?Infra/.env에 OBJECT_STORAGE_WRITE_SECRET_KEY를 지정하세요}
      AWS_DEFAULT_REGION: us-east-1
      # 게시 도구(publish-model)가 같은 컨테이너의 서버에 접속한다.
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
    depends_on:
      postgres:
        condition: service_healthy
      mlflow-db-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - models:/models
    networks:
      - public
      - internal
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging

  # ---- FE·AI (이미지 정의는 각 파트 폴더의 Dockerfile) ----
  # 웹 화면(정적 파일). 포트를 공개하지 않는다. 앞단 nginx가 `/`를 이 컨테이너(8080)로 넘긴다.
  # 빌드 때 고정되는 FE 환경 변수는 .env의 FE_VITE_*로 바꾼다(비워 두면 FE 기본값).
  web:
    build:
      context: ../FE
      args:
        VITE_KEYBOARD_INPUT: ${FE_VITE_KEYBOARD_INPUT:-}
        VITE_LOGIN_PROVIDERS: ${FE_VITE_LOGIN_PROVIDERS:-}
        VITE_MONITOR: ${FE_VITE_MONITOR:-}
        VITE_RECOMMENDATION_CONSENT_ENABLED: ${FE_VITE_RECOMMENDATION_CONSENT_ENABLED:-}
        VITE_COACH_GATE: ${FE_VITE_COACH_GATE:-}
        VITE_COACH_GATE_MODE: ${FE_VITE_COACH_GATE_MODE:-}
    networks:
      - internal
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # AI 서버(FastAPI). 포트를 공개하지 않는다. BE만 내부 네트워크(ai-api:8000)로 호출한다.
  # 채보 워커(GPU)는 이 서비스가 아니라 별도 구성이다.
  ai-api:
    build:
      context: ../AI
    networks:
      - internal
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  # 약점 분석 실측 보정 배치(COACH-003). 동의한 사용자의 비식별 기록(DB 뷰 coach_export_v)으로 임계값 후보를 만들어
  # MLflow에 기록한다. 임계값을 자동으로 바꾸지 않는다. 설명은 AI/docs/coach-calibration.md.
  # 평소에는 뜨지 않는다(profiles). 예약 실행이나 사람이 docker compose run --rm coach-calibration [--force]로 부른다.
  # DB 접속은 뷰만 읽을 수 있는 읽기 전용 계정(coach_export)이고, 계정·비밀번호·소금은 서버에서 직접 만든다(Infra/SECURITY.md).
  coach-calibration:
    build:
      context: ../AI
    profiles: ["calibration"]
    # 시작 직후와 종료 직전에 15초씩 기다린다. Alloy가 컨테이너를 찾는 주기(5초) 안에 로그 수집이 붙어서
    # 끝에 남기는 상태 줄(coach-calibration status=...)이 Loki에 들어가게 하려는 것이다. 사라지면 알림이 못 본다.
    # run에 붙인 인자(예: --force)는 "$@"로 배치에 전달된다.
    entrypoint:
      - sh
      - -c
      - |
        sleep 15
        case "$$SSAPLASH_COACH_EXPORT_DSN" in
          *:@*) echo "coach-calibration status=FAIL error=MissingExportPassword"; sleep 15; exit 1 ;;
        esac
        python -m ssaplash_ai.coach_calibration.cli "$$@"
        code=$$?
        sleep 15
        exit $$code
      - coach-calibration
    command: []
    environment:
      # 읽기 전용 계정. 비밀번호가 비어 있으면(.env에 없으면) 위 검사가 접속 전에 멈춘다.
      SSAPLASH_COACH_EXPORT_DSN: postgresql://coach_export:${COACH_EXPORT_PASSWORD:-}@postgres:5432/${POSTGRES_DB}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # 정책 파일은 서버 이미지에 들어가지 않으므로 마운트한다. 경로를 줬는데 파일이 없으면 배치가 실패한다.
      SSAPLASH_CALIBRATION_POLICY: /config/calibration_policy.yaml
    volumes:
      - ../AI/configs/coach:/config:ro
    networks:
      - internal
    mem_limit: 1g
    # 이미지의 HEALTHCHECK는 AI 서버(8000번 포트)용이라 일회성 배치에는 맞지 않는다.
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    logging: *default-logging

  # 곡 추천 R3 후보 배치(COACH-004). 동의한 사용자의 가명 기록(recommend_*_v 뷰)으로 후보를 만들어 BE에 적재한다.
  # 평소에는 뜨지 않는다(profiles). 내부 네트워크로 DB와 BE에 닿으므로 DB 포트, SSH 터널, 공개 Nginx 경로가 필요 없다.
  # --upload를 주지 않으면 적재하지 않는다. 사용법은 Infra/README.md, 설명은 AI/docs/recommend-poc.md.
  recommend-batch:
    build:
      context: ../AI
    profiles: ["recommend"]
    # 시작과 종료에 15초씩 기다리는 이유는 coach-calibration과 같다(상태 줄이 Loki에 들어가게).
    entrypoint:
      - sh
      - -c
      - |
        sleep 15
        case "$$SSAPLASH_RECOMMEND_EXPORT_DSN" in
          *:@*) echo "recommend-batch status=FAIL error=MissingExportPassword"; sleep 15; exit 1 ;;
        esac
        # 전체 시간 제한. 철회자의 기록이 메모리에 남는 최대 시간이기도 하다. 끝나면 프로세스와 함께 사라진다
        timeout -k 30 "$$RECOMMEND_BATCH_TIMEOUT_SEC" python -m ssaplash_ai.recommend.batch "$$@"
        code=$$?
        if [ "$$code" -eq 0 ]; then echo "recommend-batch status=OK"; elif [ "$$code" -eq 124 ] || [ "$$code" -eq 137 ]; then echo "recommend-batch status=FAIL error=Timeout"; else echo "recommend-batch status=FAIL code=$$code"; fi
        sleep 15
        exit $$code
      - recommend-batch
    command: []
    environment:
      # 읽기 전용 계정. 비밀번호가 비어 있으면(.env에 없으면) 위 검사가 접속 전에 멈춘다.
      SSAPLASH_RECOMMEND_EXPORT_DSN: postgresql://recommend_export:${RECOMMEND_EXPORT_PASSWORD:-}@postgres:5432/${POSTGRES_DB}
      SSAPLASH_WORKER_BASE_URL: http://api:8080
      SSAPLASH_WORKER_TOKEN: ${RECOMMEND_BATCH_TOKEN:-}
      RECOMMEND_BATCH_TIMEOUT_SEC: ${RECOMMEND_BATCH_TIMEOUT_SEC:-3600}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    networks:
      - internal
    mem_limit: 2g
    # 이미지의 HEALTHCHECK는 AI 서버(8000번 포트)용이라 일회성 배치에는 맞지 않는다.
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    logging: *default-logging

  # 인증서 발급·갱신 도구. 평소에는 실행하지 않고(profiles) 필요할 때만 docker compose run으로 쓴다.
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: ["tools"]
    entrypoint: ["certbot"]
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - public
    logging: *default-logging

networks:
  public: {}
  internal:
    internal: true

volumes:
  pgdata:
  redisdata:
  seaweeddata:
  models:
  prometheus-data:
  loki-data:
  grafana-data:
  alloy-data:
  certbot-www:
  letsencrypt:
