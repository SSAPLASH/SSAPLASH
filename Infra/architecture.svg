<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 775" width="1000" height="775" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13">
  <title>에어 드럼 인프라 구성도</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="775" fill="#ffffff"/>
  <text x="500" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">에어 드럼 인프라 구성도 (2026-10-25 기준)</text>

  <!-- 인터넷 -->
  <rect x="40" y="50" width="160" height="50" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="120" y="80" text-anchor="middle" fill="#0f172a">사용자 브라우저</text>
  <rect x="250" y="50" width="220" height="50" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="360" y="72" text-anchor="middle" fill="#0f172a">도메인</text>
  <text x="360" y="90" text-anchor="middle" font-size="12" fill="#334155">k15a307.p.ssafy.io</text>
  <rect x="520" y="50" width="200" height="50" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="620" y="72" text-anchor="middle" fill="#0f172a">AWS 보안 그룹</text>
  <text x="620" y="90" text-anchor="middle" font-size="12" fill="#334155">22 · 80 · 443 허용</text>
  <rect x="780" y="50" width="190" height="50" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="875" y="72" text-anchor="middle" fill="#0f172a">팀원 PC</text>
  <text x="875" y="90" text-anchor="middle" font-size="12" fill="#334155">SSH 키로 접속·터널</text>
  <line x1="200" y1="75" x2="248" y2="75" stroke="#475569" marker-end="url(#a)"/>
  <line x1="470" y1="75" x2="518" y2="75" stroke="#475569" marker-end="url(#a)"/>

  <!-- EC2 -->
  <rect x="30" y="130" width="940" height="540" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="48" y="154" font-weight="bold" fill="#0f172a">EC2 · Ubuntu 24.04 · ufw: 22, 80, 443 허용 (기본 차단)</text>
  <line x1="620" y1="100" x2="620" y2="128" stroke="#475569" marker-end="url(#a)"/>
  <line x1="875" y1="100" x2="875" y2="128" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- Docker Compose -->
  <rect x="48" y="170" width="650" height="480" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="62" y="192" font-weight="bold" fill="#1d4ed8">Docker Compose (프로젝트 이름 infra) · 네트워크 public / internal</text>

  <!-- 서비스 -->
  <rect x="70" y="215" width="140" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="140" y="239" text-anchor="middle" font-weight="bold" fill="#0f172a">nginx</text>
  <text x="140" y="258" text-anchor="middle" font-size="12" fill="#334155">80 (443 예정)</text>

  <rect x="270" y="215" width="150" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="345" y="239" text-anchor="middle" font-weight="bold" fill="#0f172a">api</text>
  <text x="345" y="258" text-anchor="middle" font-size="12" fill="#334155">Spring Boot (JDK 21)</text>

  <rect x="500" y="205" width="170" height="40" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="585" y="230" text-anchor="middle" fill="#0f172a">postgres (TimescaleDB)</text>
  <rect x="500" y="255" width="170" height="34" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="585" y="277" text-anchor="middle" fill="#0f172a">redis</text>

  <rect x="270" y="335" width="150" height="56" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="345" y="359" text-anchor="middle" font-weight="bold" fill="#0f172a">seaweedfs</text>
  <text x="345" y="378" text-anchor="middle" font-size="12" fill="#334155">S3 호환 스토리지</text>

  <rect x="500" y="335" width="170" height="56" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="585" y="359" text-anchor="middle" font-weight="bold" fill="#0f172a">mlflow</text>
  <text x="585" y="378" text-anchor="middle" font-size="12" fill="#334155">127.0.0.1:5000 (터널로만)</text>

  <rect x="70" y="340" width="140" height="46" rx="8" fill="#fef9c3" stroke="#a16207"/>
  <text x="140" y="361" text-anchor="middle" fill="#0f172a">볼륨 models</text>
  <text x="140" y="378" text-anchor="middle" font-size="12" fill="#334155">모델 파일·매니페스트</text>

  <!-- 흐름 화살표 -->
  <line x1="210" y1="243" x2="268" y2="243" stroke="#475569" marker-end="url(#a)"/>
  <text x="239" y="236" text-anchor="middle" font-size="11" fill="#475569">/api</text>
  <line x1="420" y1="235" x2="498" y2="228" stroke="#475569" marker-end="url(#a)"/>
  <line x1="420" y1="255" x2="498" y2="272" stroke="#475569" marker-end="url(#a)"/>
  <line x1="345" y1="271" x2="345" y2="333" stroke="#475569" marker-end="url(#a)"/>
  <text x="352" y="306" font-size="11" fill="#475569">내부 주소</text>
  <path d="M140 271 L140 300 L300 300 L300 333" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="150" y="294" font-size="11" fill="#475569">서명 URL</text>
  <line x1="140" y1="340" x2="140" y2="273" stroke="#475569" marker-end="url(#a)"/>
  <text x="68" y="318" font-size="11" fill="#475569">/models</text>
  <line x1="500" y1="363" x2="422" y2="363" stroke="#475569" marker-end="url(#a)"/>
  <path d="M670 363 L688 363 L688 225 L672 225" fill="none" stroke="#475569" marker-end="url(#a)"/>
  <text x="684" y="300" text-anchor="end" font-size="11" fill="#475569">mlflow DB</text>
  <path d="M500 380 L460 410 L140 410 L140 388" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="300" y="404" font-size="11" fill="#475569">게시 도구</text>

  <!-- 모니터링 -->
  <rect x="70" y="440" width="610" height="190" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="84" y="462" font-weight="bold" fill="#9a3412">모니터링·로그 (외부에 공개하지 않음)</text>
  <rect x="90" y="480" width="130" height="34" rx="6" fill="#ffedd5" stroke="#c2410c"/>
  <text x="155" y="502" text-anchor="middle" fill="#0f172a">node-exporter</text>
  <rect x="90" y="530" width="130" height="34" rx="6" fill="#ffedd5" stroke="#c2410c"/>
  <text x="155" y="552" text-anchor="middle" fill="#0f172a">cadvisor</text>
  <rect x="270" y="505" width="130" height="40" rx="6" fill="#ffedd5" stroke="#c2410c"/>
  <text x="335" y="530" text-anchor="middle" fill="#0f172a">prometheus</text>
  <rect x="90" y="580" width="130" height="34" rx="6" fill="#ffedd5" stroke="#c2410c"/>
  <text x="155" y="602" text-anchor="middle" fill="#0f172a">alloy (로그 수집)</text>
  <rect x="270" y="580" width="130" height="34" rx="6" fill="#ffedd5" stroke="#c2410c"/>
  <text x="335" y="602" text-anchor="middle" fill="#0f172a">loki (7일)</text>
  <rect x="470" y="535" width="190" height="50" rx="6" fill="#ffedd5" stroke="#c2410c"/>
  <text x="565" y="558" text-anchor="middle" font-weight="bold" fill="#0f172a">grafana</text>
  <text x="565" y="576" text-anchor="middle" font-size="12" fill="#334155">127.0.0.1:3000 (터널로만)</text>
  <line x1="220" y1="497" x2="268" y2="520" stroke="#475569" marker-end="url(#a)"/>
  <line x1="220" y1="547" x2="268" y2="533" stroke="#475569" marker-end="url(#a)"/>
  <line x1="220" y1="597" x2="268" y2="597" stroke="#475569" marker-end="url(#a)"/>
  <line x1="400" y1="525" x2="468" y2="550" stroke="#475569" marker-end="url(#a)"/>
  <line x1="400" y1="597" x2="468" y2="575" stroke="#475569" marker-end="url(#a)"/>

  <!-- 호스트 -->
  <rect x="716" y="170" width="236" height="480" rx="10" fill="#ffffff" stroke="#475569"/>
  <text x="730" y="192" font-weight="bold" fill="#0f172a">호스트 (서버 자체)</text>
  <rect x="730" y="210" width="208" height="48" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="834" y="230" text-anchor="middle" fill="#0f172a">sshd :22</text>
  <text x="834" y="248" text-anchor="middle" font-size="12" fill="#334155">키 로그인만 허용</text>
  <rect x="730" y="272" width="208" height="56" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="834" y="294" text-anchor="middle" fill="#0f172a">gitlab-runner ec2-docker</text>
  <text x="834" y="312" text-anchor="middle" font-size="12" fill="#334155">CI 테스트·빌드 (Docker)</text>
  <rect x="730" y="342" width="208" height="56" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="834" y="364" text-anchor="middle" fill="#0f172a">gitlab-runner ec2-deploy</text>
  <text x="834" y="382" text-anchor="middle" font-size="12" fill="#334155">배포 (보호된 러너)</text>
  <rect x="730" y="412" width="208" height="62" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="834" y="434" text-anchor="middle" fill="#0f172a">/srv/airdrum</text>
  <text x="834" y="452" text-anchor="middle" font-size="12" fill="#334155">배포된 코드 + Infra/.env</text>
  <text x="834" y="467" text-anchor="middle" font-size="11" fill="#334155">(.env는 서버에만 존재)</text>
  <rect x="730" y="488" width="208" height="56" rx="6" fill="#e2e8f0" stroke="#475569" stroke-dasharray="4 3"/>
  <text x="834" y="510" text-anchor="middle" fill="#0f172a">certbot (필요할 때만)</text>
  <text x="834" y="528" text-anchor="middle" font-size="12" fill="#334155">인증서 발급·갱신 (39번)</text>
  <rect x="730" y="558" width="208" height="44" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="834" y="578" text-anchor="middle" fill="#0f172a">unattended-upgrades</text>
  <text x="834" y="594" text-anchor="middle" font-size="12" fill="#334155">자동 보안 패치</text>
  <line x1="834" y1="398" x2="834" y2="410" stroke="#475569" marker-end="url(#a)"/>
  <path d="M730 436 L712 436 L712 300 L700 300" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="712" y="426" text-anchor="end" font-size="11" fill="#475569">compose up</text>

  <!-- GitLab -->
  <rect x="40" y="690" width="300" height="52" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="190" y="713" text-anchor="middle" fill="#0f172a">GitLab (lab.ssafy.com)</text>
  <text x="190" y="731" text-anchor="middle" font-size="12" fill="#334155">MR · CI 파이프라인 · deploy/rollback 수동 잡</text>
  <path d="M340 716 L834 716 L834 654" fill="none" stroke="#475569" marker-end="url(#a)"/>
  <text x="600" y="708" text-anchor="middle" font-size="11" fill="#475569">러너가 GitLab에서 잡을 가져감</text>

  <!-- 범례 -->
  <text x="360" y="744" font-size="11" fill="#475569">실선: 요청·데이터 흐름 / 점선: 서명 URL·게시 등 부가 동작</text>
  <text x="360" y="760" font-size="11" fill="#475569">파랑: 앱 서비스 / 초록: 데이터 저장소 / 주황: 모니터링</text>
</svg>
