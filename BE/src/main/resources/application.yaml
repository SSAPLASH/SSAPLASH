spring:
  application:
    name: airdrum-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    # 검증 메시지 등 프레임워크 문구를 Accept-Language와 무관하게 한국어로 고정한다.
    locale: ko_KR
    locale-resolver: fixed
  # PostgreSQL 16. 비밀번호는 기본값이 없어 DB_PASSWORD를 주지 않으면 기동하지 않는다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/app}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD}
    hikari:
      # 풀에서 연결을 기다리는 상한(ms). 기본 30초면 DB 장애 때 요청·헬스체크가 30초씩 묶인다.
      connection-timeout: 5000
  # 스키마는 db/migration의 Flyway SQL만 만든다. 파일명 규칙(V{n}__{설명}.sql)에 어긋나면 기동을 실패시킨다.
  flyway:
    validate-migration-naming: true
  jpa:
    # Hibernate는 엔티티와 스키마가 맞는지 검증만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  level:
    # 404·405는 GlobalExceptionHandler가 WARN 한 줄로 남긴다. DispatcherServlet의 중복 WARN은 숨긴다.
    org.springframework.web.servlet.PageNotFound: ERROR

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      # DB에 못 붙으면 readiness는 503이다. liveness는 프로세스 상태만 본다.
      group:
        readiness:
          include: readinessState,db

# OpenAPI 문서(/v3/api-docs)와 Swagger UI(/swagger-ui/index.html).
# 운영 환경은 SWAGGER_ENABLED=false 로 둘 다 닫는다.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha
