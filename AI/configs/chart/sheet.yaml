# MusicXML 드럼 악보 → 채보 설정 (S15P31A307-292, 설계 CHART-003-sheet-to-chart)
# 채보 JSON generatorVersion. BE generator는 ADT_MODEL만 받아서 악보에서 온 채보는 이 값으로 구분
generator_version: sheet-musicxml-1
# 악보에 템포 표기가 없을 때 쓰는 bpm
default_bpm: 120
# 반복을 펼친 곡 길이 상한(초). BE MIDI 업로드와 같은 30분
max_duration_sec: 1800
# 열린 하이햇 노트에 필드를 붙일지. BE·FE와 필드 형식을 맞추기 전까지 false (설계 U3)
emit_hihat_open: false
hihat_open_field: hihatOpen
schema_version: 1
