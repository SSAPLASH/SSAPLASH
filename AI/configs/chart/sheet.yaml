# MusicXML 드럼 악보 → 채보 설정 (S15P31A307-292, 설계 CHART-003-sheet-to-chart)
# 채보 JSON generatorVersion. BE generator는 ADT_MODEL만 받아서 악보에서 온 채보는 이 값으로 구분
generator_version: sheet-musicxml-2
# 악보에 템포 표기가 없을 때 쓰는 bpm
default_bpm: 120
# 반복을 펼친 곡 길이 상한(초). BE MIDI 업로드와 같은 30분
max_duration_sec: 1800
# 하이햇 페달(GM 44)을 HIHAT_PEDAL 노트로 낼지. false면 HIHAT으로 합침. BE 결과 검증은 HIHAT_PEDAL을 받음
# (S15P31A307-266). 켜면서 generator_version을 sheet-musicxml-2로 올림
emit_hihat_pedal: true
# 열린 하이햇 노트에 hihatOpen: true를 붙일지. BE 채보 조회 응답에 이 필드가 없고 FE 판정 방식이 정해지지 않아
# false. 켤 때 generator_version을 sheet-musicxml-3으로 올림
emit_hihat_open: false
hihat_open_field: hihatOpen
schema_version: 1
