# 드럼 채보 추론 모듈 설정. 상대 경로는 AI/ 폴더 기준.
# 환경 변수: SSAPLASH_CHART_DEVICE, SSAPLASH_MODELS_DIR, SSAPLASH_WORK_DIR, SSAPLASH_CHART_MODEL(model 값보다 우선).
# 채보 모델을 바꾸려면 model 이름이나 SSAPLASH_CHART_MODEL을 바꾸고 워커를 다시 띄움.
# 워커 로그 "채보 모델 선택:" 줄과 채보 JSON의 generatorVersion으로 어느 모델이 도는지 확인
model: strum
models:
  # 원래 ADTOF + 드럼 킷 분리. 되돌리기용
  original: configs/bench/transcribers/adtof_drumsep/adtof_drumsep_ds_ov2.yaml
  # 패드별 가중치 조합. 실험용. SSAPLASH_MODELS_DIR/adtof_ft/ 아래 가중치 두 개 필요
  combo: configs/bench/transcribers/adtof_drumsep/adtof_drumsep_realrec.yaml
  # 원래 ADTOF와 실제 곡 학습 가중치의 점수 평균. 되돌리기용. SSAPLASH_MODELS_DIR/songsterr_ft/ 아래 가중치 두 개 필요
  songsterr_avg: configs/bench/transcribers/adtof_drumsep/adtof_drumsep_songsterr_avg.yaml
  # 서비스 기본. STRUM 8종 온셋 CRNN 학습 가중치 + 킥 규칙. SSAPLASH_MODELS_DIR/strum_ft/songsterr_egmd/best.pt 필요
  strum: configs/bench/transcribers/strum/strum_crnn_songsterr_egmd.yaml
# cuda가 없으면 cpu로 내려감
device: cuda
# 채보 JSON schemaVersion. BE가 1만 받음
schema_version: 1
tempo:
  # beat_this 또는 librosa(torch 불필요, mock용). 박은 원곡에서 찾고 원곡이 없으면 드럼 트랙에서 찾음
  method: beat_this
  # 추정값이 이 범위 밖이면 2배·절반으로 접음. max_bpm은 min_bpm의 2배 이상
  min_bpm: 60
  max_bpm: 200
  # 박자 추정은 안 함. 고정값
  time_signature: 4/4
  # offsetMs 원점 방식. downbeat: 첫 마디 첫 박 그대로, notes: 킥·스네어 노트로 박 안 위치 보정
  origin: notes
  # Beat This! 후처리. dbn은 madmom 필요
  postprocess: dbn
  # 찾은 박을 따라가는 빠르기 구간(tempoMap)을 냄. 마디 경계가 이 ms 안으로 맞는 가장 긴 구간으로 묶음
  tempo_map: true
  tempo_map_tolerance_ms: 20
  # 채보 노트로 bpm·offsetMs 다시 맞추기. 밴드 녹음 곡에서 마디선이 덜 맞아 꺼 둠
  refine: false
# 이보다 긴 드럼 트랙은 입력 오류
max_duration_sec: 600
# 채보 가능 검사. 걸리면 실패 사유 NOT_TRANSCRIBABLE로 보고함
drum_check:
  # 곡 1분당 노트 수가 이보다 적으면 실패. 비워 두면 검사 안 함. 92는 정상 곡 1만 곡 중 1곡이 걸리는 값
  min_notes_per_minute: 92
  # 박 추적 실패(bpm 기본값 120)를 실패로 볼지. 틀린 bpm으로 메트로놈이 나가지 않게 함
  fail_on_unknown_tempo: true
