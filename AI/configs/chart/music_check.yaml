# 분리 전 음악 여부 검사. 원곡이 말소리·소음이면 분리(GPU)를 시작하지 않고 실패 사유 NOT_TRANSCRIBABLE로 보고함
# AudioSet으로 학습된 분류 모델. 가중치는 처음 올릴 때 Hugging Face에서 받음. 로컬 폴더 경로도 됨
model: MIT/ast-finetuned-audioset-10-10-0.4593
# GPU를 아끼려는 검사라 cpu. 환경 변수 SSAPLASH_CHART_DEVICE를 따르지 않음
device: cpu
# 구간 평균 음악 확률이 이보다 낮으면 실패. 비워 두면 이 조건을 안 봄
# 값의 근거: 정상 곡 782개의 분포에서 1만 곡 중 1곡이 잘못 걸리는 값. 이 값에서 정상 곡 782개는 0개,
# 말소리·소음·배경음악 깔린 말소리 229개는 229개가 걸림. 분류 모델을 바꾸면 다시 정해야 함
min_music_prob: 0.28
# 구간 평균 말소리 확률이 이 값 이상이면 실패. 비워 두면 이 조건을 안 봄. 둘 다 비우면 검사를 안 하고 모델도 안 올림
max_speech_prob: 0.44
# 구간을 뽑는 위치(곡 길이에 대한 비율)와 구간 길이(초)
positions: [0.2, 0.4, 0.6, 0.8]
window_sec: 10
max_duration_sec: 600
