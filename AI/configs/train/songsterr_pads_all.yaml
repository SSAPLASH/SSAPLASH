# 11/08 실제 곡(Songsterr 인기곡) 학습. scripts/make_songsterr_splits.py가 만듦
classes: pads
base_checkpoint: null
window_frames: 412
batch_size: 32
steps_per_epoch: 1000
max_epochs: 6
learning_rate: 0.0001
lr_reduce_patience: 2
early_stop_patience: 3
label_radiation: 1
class_weights: null
tom_weight_mult: 2.0
tom_window_frac: 0.5
accomp_mix_prob: 0.3
accomp_gain_range:
- 0.05
- 0.3
gain_db_range:
- -6
- 6
freeze_cnn: false
eval_every: 1
select_metric: f1
guard_drop: 0.02
fit_thresholds: true
windows_per_song: 64
seed: 0
num_workers: 4
device: cuda
train_datasets:
- path: configs/bench/datasets/public_songs_train_all.yaml
  weight: 1.0
val_datasets:
- path: configs/bench/datasets/public_songs_val.yaml
  n_songs: 10
