# ADTOF Frame_RNN 파인튜닝, 5클래스(킥·스네어·탐·하이햇·심벌) 그대로.
# 학습 입력은 정답 드럼 트랙. 탐 강조: 윈도 절반을 탐 타격 중심으로, 탐 클래스 가중치 ×2.
# 체크포인트 선택은 E-GMD validation 어쿠스틱 20곡 + STAR validation 20곡의 탐 검출 F1(tom_f1).
# 실행: uv run ssaplash-train adtof-finetune --config configs/train/adtof_tom_5cls.yaml --out data/models/adtof_ft/tom_5cls
base_checkpoint: null  # null이면 adtof_pytorch 패키지 기본 가중치
classes: five
train_datasets:
  - {path: configs/bench/datasets/egmd_train_acoustic.yaml, weight: 0.5}
  - {path: configs/bench/datasets/star_drums_training_ismir04.yaml, weight: 0.2}
  - {path: configs/bench/datasets/star_drums_training_mtg.yaml, weight: 0.2}
val_datasets:
  - {path: configs/bench/datasets/egmd_validation_acoustic.yaml, n_songs: 20}
  - {path: configs/bench/datasets/star_drums_validation.yaml, n_songs: 20}
window_frames: 412
batch_size: 32
steps_per_epoch: 2000
max_epochs: 20
learning_rate: 0.0001
lr_reduce_patience: 2
early_stop_patience: 4
label_radiation: 1
class_weights: null  # null이면 ADTOF 원본 [1.078, 1.353, 3.414, 1.144, 1.768]
tom_weight_mult: 2.0
tom_window_frac: 0.5
accomp_mix_prob: 0.3
accomp_gain_range: [0.05, 0.3]
gain_db_range: [-6, 6]
freeze_cnn: false
eval_every: 1
select_metric: tom_f1
guard_drop: 0.02  # 5가지 클래스 F1이 기본 가중치보다 이만큼 넘게 떨어진 에폭은 best.pth로 안 고름
fit_thresholds: true
windows_per_song: 8
seed: 0
num_workers: 8
device: cuda
