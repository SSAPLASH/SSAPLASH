# 실제 녹음 학습 확인 실험 후속. tom_6cls_real_no_d1과 같고 아래만 다름.
# 전체 학습(2026-11-03 결과로 서비스 기본에서 내림): 뺀 드러머·묶음 없이 ENST 드러머 1·2·3 전체 연주와 MDB 23곡 전부를 더함. 비율은 no_d* 와 같음.
# 학습에 안 쓴 실제 녹음이 없어 실제 녹음 점수는 tom_6cls_real_no_d* 세 학습의 합친 결과로 대신함.
# 실행: 서버 notebooks/real_drum_check_server.ipynb FULL 절, 결과 data/models/adtof_ft/tom_6cls_real_full
# 결과(2026-11-03): 이 가중치를 쓴 패드별 조합(adtof_drumsep_realrec.yaml)은 MDB·ENST에서는 올랐으나 실제 발매곡
# PDO 무료 5곡에서 원래 ADTOF보다 낮아(0.647 → 0.608) 서비스에 안 씀
base_checkpoint: null  # null이면 adtof_pytorch 패키지 기본 가중치
classes: five_pedal
train_datasets:
  - {path: configs/bench/datasets/egmd_train_acoustic.yaml, weight: 0.5}
  - {path: configs/bench/datasets/star_drums_training_ismir04.yaml, weight: 0.2}
  - {path: configs/bench/datasets/star_drums_training_mtg.yaml, weight: 0.2}
  # 실제 녹음. ENST는 주석에 페달 표시가 없어 페달 채널 손실을 뺌
  - {path: configs/bench/datasets/real_check/enst_train_all.yaml, weight: 0.15, ignore_classes: [pedal]}
  - {path: configs/bench/datasets/mdb_drums.yaml, weight: 0.1}
val_datasets:
  - {path: configs/bench/datasets/egmd_validation_acoustic.yaml, n_songs: 20}
  - {path: configs/bench/datasets/star_drums_validation.yaml, n_songs: 20}
window_frames: 412
batch_size: 32
steps_per_epoch: 2000
max_epochs: 20
learning_rate: 0.0001
lr_reduce_patience: 2
early_stop_patience: 4
label_radiation: 1
class_weights: null  # null이면 [1.078, 1.353, 3.414, 1.144, 1.768, 1.144] (ADTOF 원본 + 페달은 하이햇 값)
tom_weight_mult: 2.0
pedal_weight_mult: 2.0
tom_window_frac: 0.5
accomp_mix_prob: 0.3
accomp_gain_range: [0.05, 0.3]
gain_db_range: [-6, 6]
freeze_cnn: false
eval_every: 1
select_metric: tom_pedal_f1
guard_drop: 0.02
fit_thresholds: true
windows_per_song: 8
seed: 0
num_workers: 8
device: cuda
