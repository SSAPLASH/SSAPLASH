# 실제 녹음 학습 확인 실험. adtof_tom_6cls.yaml과 같고 아래만 다름.
# H3 조건부: tom_6cls_real_no_d3에 드러머 3의 반주 없는 연주를 더함. H1 판정이 '아님'일 때만 돌림.
# 실행: 서버 notebooks/real_drum_check_server.ipynb (scripts/train_queue.py --parallel), 결과 data/models/adtof_ft/tom_6cls_real_d3_practice
base_checkpoint: null  # null이면 adtof_pytorch 패키지 기본 가중치
classes: five_pedal
train_datasets:
  - {path: configs/bench/datasets/egmd_train_acoustic.yaml, weight: 0.5}
  - {path: configs/bench/datasets/star_drums_training_ismir04.yaml, weight: 0.2}
  - {path: configs/bench/datasets/star_drums_training_mtg.yaml, weight: 0.2}
  # 실제 녹음. ENST는 주석에 페달 표시가 없어 페달 채널 손실을 뺌
  - {path: configs/bench/datasets/real_check/enst_train_no_d3.yaml, weight: 0.15, ignore_classes: [pedal]}
  - {path: configs/bench/datasets/real_check/mdb_train_no_f3.yaml, weight: 0.1}
  # H3: 평가 드러머 3의 반주 없는 연주(hits·phrase·solo). 반주 곡은 평가용이라 안 넣음
  - {path: configs/bench/datasets/real_check/enst_practice_d3.yaml, weight: 0.1, ignore_classes: [pedal]}
val_datasets:
  - {path: configs/bench/datasets/egmd_validation_acoustic.yaml, n_songs: 20}
  - {path: configs/bench/datasets/star_drums_validation.yaml, n_songs: 20}
window_frames: 412
batch_size: 32
steps_per_epoch: 2000
max_epochs: 20
learning_rate: 0.0001
lr_reduce_patience: 2
early_stop_patience: 4
label_radiation: 1
class_weights: null  # null이면 [1.078, 1.353, 3.414, 1.144, 1.768, 1.144] (ADTOF 원본 + 페달은 하이햇 값)
tom_weight_mult: 2.0
pedal_weight_mult: 2.0
tom_window_frac: 0.5
accomp_mix_prob: 0.3
accomp_gain_range: [0.05, 0.3]
gain_db_range: [-6, 6]
freeze_cnn: false
eval_every: 1
select_metric: tom_pedal_f1
guard_drop: 0.02
fit_thresholds: true
windows_per_song: 8
seed: 0
num_workers: 8
device: cuda
