# 7클래스 + 실제 녹음 학습. tom_6cls_real_no_d1.yaml과 같고
# classes만 five_pedal_cym(크래시·라이드를 따로 냄), 체크포인트 선택은 focus_f1(탐·페달·크래시·라이드 F1 평균). adtof_tom_7cls.yaml과 같은 차이
# 실행: 서버 notebooks/cym7_real_server.ipynb, 결과 data/models/adtof_ft/tom_7cls_real_no_d1
base_checkpoint: null  # null이면 adtof_pytorch 패키지 기본 가중치
classes: five_pedal_cym
train_datasets:
  - {path: configs/bench/datasets/egmd_train_acoustic.yaml, weight: 0.5}
  - {path: configs/bench/datasets/star_drums_training_ismir04.yaml, weight: 0.2}
  - {path: configs/bench/datasets/star_drums_training_mtg.yaml, weight: 0.2}
  # 실제 녹음. ENST는 주석에 페달 표시가 없어 페달 채널 손실을 뺌
  - {path: configs/bench/datasets/real_check/enst_train_no_d1.yaml, weight: 0.15, ignore_classes: [pedal]}
  - {path: configs/bench/datasets/real_check/mdb_train_no_f1.yaml, weight: 0.1}
val_datasets:
  - {path: configs/bench/datasets/egmd_validation_acoustic.yaml, n_songs: 20}
  - {path: configs/bench/datasets/star_drums_validation.yaml, n_songs: 20}
window_frames: 412
batch_size: 32
steps_per_epoch: 2000
max_epochs: 20
learning_rate: 0.0001
lr_reduce_patience: 2
early_stop_patience: 4
label_radiation: 1
class_weights: null  # null이면 [1.078, 1.353, 3.414, 1.144, 1.768, 1.144, 1.768] (ADTOF 원본 + 페달은 하이햇 값, 라이드는 심벌 값)
tom_weight_mult: 2.0
pedal_weight_mult: 2.0
tom_window_frac: 0.5
accomp_mix_prob: 0.3
accomp_gain_range: [0.05, 0.3]
gain_db_range: [-6, 6]
freeze_cnn: false
eval_every: 1
select_metric: focus_f1
guard_drop: 0.02
fit_thresholds: true
windows_per_song: 8
seed: 0
num_workers: 8
device: cuda
