# YourMT3+ 보조 변형 YPTF+Multi (PS) (29.9M). 배포된 체크포인트 중 공개 드럼 점수 1위(ENST 드럼만 90.61).
# 비교표 본문에는 앱 기본값(yourmt3.yaml)만 넣고 이건 gmd_test 정답 드럼 입력에만 돌림 (설계 U19)
# 출력은 다악기 노트 중 드럼(is_drum)의 GM 피치, 세기 없음(0/1만 학습). 드럼 토큰 범위 0~127이 전부 키로 있음.
# 탐 경계는 우리 정답(GMD) 기준: 50·48 하이, 47·45 미드, 43·41·58 플로어 (설계 U9). 58은 GM 이름(비브라슬랩)이
# 아니라 E-GMD 탐 림 뜻, 3은 ENST 전처리의 기타 심벌(MDB 정답의 차이나·스플래시처럼 CRASH) (설계 U20)
name: yourmt3_ps
adapter: external
env_name: yourmt3
python_exe: .venv-yourmt3/Scripts/python.exe  # 이 파일이 없으면(Linux·서버) .venv-<env_name>/bin/python을 자동으로 찾음
script: scripts/transcribers_ext/yourmt3_transcribe.py
variant: YPTF+Multi (PS)
options:
  repo_dir: ext/YourMT3
velocity: false
input_sample_rate: 16000
license_code: Apache-2.0 (HF Space 소스 머리 주석·메타데이터. GitHub 저장소 표기는 GPL-3.0이나 코드 없음)
license_weights: Apache-2.0 (HF 모델 저장소 mimbres/YourMT3 README. 학습 데이터 중 MAESTRO·ENST는 비상업 조건)
source_url: https://huggingface.co/spaces/mimbres/YourMT3
labels:
  35: KICK
  36: KICK
  37: SNARE
  38: SNARE
  40: SNARE
  42: HIHAT
  44: HIHAT
  46: HIHAT
  22: HIHAT
  26: HIHAT
  50: HI_TOM
  48: HI_TOM
  47: MID_TOM
  45: MID_TOM
  43: FLOOR_TOM
  41: FLOOR_TOM
  58: FLOOR_TOM
  49: CRASH
  57: CRASH
  52: CRASH
  55: CRASH
  3: CRASH
  51: RIDE
  53: RIDE
  59: RIDE
