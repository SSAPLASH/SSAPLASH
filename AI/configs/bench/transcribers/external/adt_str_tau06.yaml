# ADT_STR (2026-01, transformer 69M, 26분류). 별도 환경 .venv-adt-str + 저장소 클론 ext/ADT_STR (README).
# tau 0.6 변형(비교용). 출력은 GM 피치 MIDI(세기 있음) → 아래 대응표.
# 탐 경계는 우리 정답(GMD) 기준: 50·48 하이, 47·45 미드, 43·41 플로어 (설계 U9). 패드 밖 타악기는 제외.
