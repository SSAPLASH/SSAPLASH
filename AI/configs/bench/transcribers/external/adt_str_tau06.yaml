adapter: external
env_name: adt-str
python_exe: .venv-adt-str/Scripts/python.exe  # 이 파일이 없으면(Linux·코랩) .venv-<env_name>/bin/python을 자동으로 찾음
script: scripts/transcribers_ext/adt_str_transcribe.py
variant: setting-tau-0.6
options:
  repo_dir: ext/ADT_STR
velocity: true
input_sample_rate: 24000
license_code: CC BY-SA 4.0
