# adtof_drumsep과 같되 ADTOF 가중치만 페달 출력을 더해 파인튜닝한 것(S15P31A307-164, 설계 v0.2 4-7절). 규칙은 pk_gap30(2026-10-31 채택).
# 체크포인트의 6번째 출력(GM 44번)은 HIHAT_PEDAL로 나감.
# checkpoint_path의 파일은 `ssaplash-train adtof-finetune`이 만든 best.pth (model_info에 클래스·문턱값 포함).
# 문턱값은 체크포인트의 값을 쓰고, thresholds를 적으면 그것이 우선.
name: adtof_drumsep_ft6
adapter: adtof_drumsep
velocity: false
input_sample_rate: 44100
checkpoint_path: data/models/adtof_ft/tom_6cls/best.pth
drumsep_config: configs/bench/models/msst/mdx23c_drumsep.yaml
rules:
  window_ms: 120
  cymbal_window_ms: 80
  tom_fmin: 50
  tom_fmax: 400
  tom_bands: [113, 142]
  tom_gate_ratio: 0.10
  tom_peak_mode: raw
  tom_mode: relative
  tom_relative_naming: hybrid
  tom_relative_method: peaks
  tom_relative_min_gap: 3.0
  stems:
    toms: toms
    crash: crash
    ride: ride
license_code: CC BY-NC-SA 4.0 (ADTOF) + MIT (msst)
license_weights: CC BY-NC-SA 4.0 (ADTOF 가중치를 E-GMD·STAR로 파인튜닝, 페달 출력 추가) + 미명시 (MDX23C DrumSep 가중치)
source_url: https://github.com/xavriley/ADTOF-pytorch
labels:
  KICK: KICK
  SNARE: SNARE
  HIHAT: HIHAT
  SMALL_TOM: SMALL_TOM
  MID_TOM: MID_TOM
  FLOOR_TOM: FLOOR_TOM
  CRASH: CRASH
  RIDE: RIDE
  HIHAT_PEDAL: HIHAT_PEDAL
