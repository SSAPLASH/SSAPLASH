# 패드별 가중치 조합, 실험용 (S15P31A307-164 작업 11, S15P31A307-241 작업 12). 2026-11-02 서비스에 넣었다가 11-03 되돌림.
# 결과(2026-11-03): 드럼 분리 입력 8패드 F1 MDB 0.844 → 0.886, ENST 0.790 → 0.830으로 올랐으나, 실제 발매곡인
# PDO 무료 5곡 악보와 노트 단위로 비교하면 원래 ADTOF 0.647 → 0.608로 떨어짐(하이햇 0.69 → 0.61). 서비스에는 안 씀
# 드럼 킷 분리는 한 번, ADTOF는 가중치 셋으로 세 번 돌려 패드별로 가져옴.
# - 킥·스네어·하이햇·하이햇 페달: 실제 녹음 학습 모델 tom_6cls_real_full (E-GMD·STAR에 ENST·MDB 실제 녹음을 더해 학습)
# - 탐 3종: 원래 ADTOF 가중치(tom_checkpoint_path: default). 실제 녹음 학습 모델은 처음 보는 드럼 세트의 킥을 탐으로 적음
# - 크래시·라이드: 7클래스 실제 녹음 학습 모델 tom_7cls_real_full (크래시·라이드를 모델이 직접 나눠 냄)
# 규칙(pk_gap30 + 크래시 가중치 0.7)과 드럼 킷 분리는 adtof_drumsep.yaml과 같음. 하이햇 페달은 음원 채보에서
# HIHAT으로 합침(채보 JSON 패드는 9종, HIHAT_PEDAL은 악보 채보만 냄).
# 드럼 분리 입력 8패드 F1(페달은 하이햇으로 합침, MDB 23곡·ENST 64곡, 곡마다 학습에 안 쓴 버전으로 채점):
# 원래 ADTOF + 드럼 킷 분리 0.844·0.790 → 이 조합 0.886·0.830 (2026-11-03). 표 data/results/sep_compare/compare.md, 스크립트 scripts/score_sep_compare.py.
# 가중치는 서비스에서 SSAPLASH_MODELS_DIR/adtof_ft/{tom_6cls_real_full,tom_7cls_real_full}/best.pth
name: adtof_drumsep_realrec
adapter: adtof_drumsep
velocity: false
input_sample_rate: 44100
checkpoint_path: data/models/adtof_ft/tom_6cls_real_full/best.pth
tom_checkpoint_path: default
cymbal_checkpoint_path: data/models/adtof_ft/tom_7cls_real_full/best.pth
drumsep_config: configs/bench/models/msst/mdx23c_drumsep.yaml
rules:
  window_ms: 120
  cymbal_window_ms: 80
  tom_fmin: 50
  tom_fmax: 400
  tom_bands: [113, 142]
  tom_gate_ratio: 0.10
  tom_peak_mode: raw
  tom_mode: relative
  tom_relative_method: peaks
  tom_relative_naming: hybrid
  tom_relative_min_gap: 3.0
  cymbal_crash_weight: 0.7
  stems:
    toms: toms
    crash: crash
    ride: ride
license_code: CC BY-NC-SA 4.0 (ADTOF) + MIT (msst)
license_weights: CC BY-NC-SA 4.0 (원래 ADTOF 가중치, 그리고 이를 E-GMD·STAR·ENST·MDB로 파인튜닝한 가중치 2개. ENST는 학생 학업용 허락) + 미명시 (MDX23C DrumSep 가중치, aufr33·jarredou 공개)
source_url: https://github.com/xavriley/ADTOF-pytorch
labels:
  KICK: KICK
  SNARE: SNARE
  HIHAT: HIHAT
  SMALL_TOM: SMALL_TOM
  MID_TOM: MID_TOM
  FLOOR_TOM: FLOOR_TOM
  CRASH: CRASH
  RIDE: RIDE
  HIHAT_PEDAL: HIHAT
