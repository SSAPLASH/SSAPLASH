# 드럼 분리 입력 비교용. 7클래스 + 실제 녹음 학습의 채점용 버전 d1
# (학습에서 뺀 것: ENST 드러머 1, MDB 묶음 1). adtof_drumsep_ft7.yaml과 같고 이름과 checkpoint_path만 다름. 비교에는 크래시·라이드만 씀
name: cym7real_heldout_d1
adapter: adtof_drumsep
velocity: false
input_sample_rate: 44100
checkpoint_path: data/models/adtof_ft/tom_7cls_real_no_d1/best.pth
drumsep_config: configs/bench/models/msst/mdx23c_drumsep.yaml
rules:
  window_ms: 120
  cymbal_window_ms: 80
  tom_fmin: 50
  tom_fmax: 400
  tom_bands: [113, 142]
  tom_gate_ratio: 0.10
  tom_peak_mode: raw
  tom_mode: relative
  tom_relative_naming: hybrid
  tom_relative_method: peaks
  tom_relative_min_gap: 3.0
  stems:
    toms: toms
    crash: crash
    ride: ride
license_code: CC BY-NC-SA 4.0 (ADTOF) + MIT (msst)
license_weights: CC BY-NC-SA 4.0 (ADTOF 가중치를 E-GMD·STAR·ENST·MDB로 파인튜닝, 페달·크래시·라이드 출력 추가) + 미명시 (MDX23C DrumSep 가중치)
source_url: https://github.com/xavriley/ADTOF-pytorch
labels:
  KICK: KICK
  SNARE: SNARE
  HIHAT: HIHAT
  SMALL_TOM: SMALL_TOM
  MID_TOM: MID_TOM
  FLOOR_TOM: FLOOR_TOM
  CRASH: CRASH
  RIDE: RIDE
  HIHAT_PEDAL: HIHAT_PEDAL
