# ADTOF 단독, 9패드 직접 출력 파인튜닝 가중치 (S15P31A307-164, 설계 4-5절). 분리·규칙 없이 드럼 입력 → 9패드.
# checkpoint_path의 best.pth는 model_info.class_set이 pads라 어댑터가 패드 이름을 원래 라벨로 냄.
name: adtof_ft_9cls
adapter: adtof
velocity: false
input_sample_rate: 44100
checkpoint_path: data/models/adtof_ft/tom_9cls/best.pth
license_code: CC BY-NC-SA 4.0
license_weights: CC BY-NC-SA 4.0 (ADTOF 가중치를 E-GMD·STAR로 파인튜닝, 출력층 9패드)
source_url: https://github.com/xavriley/ADTOF-pytorch
labels:
  KICK: KICK
  SNARE: SNARE
  HIHAT: HIHAT
  SMALL_TOM: SMALL_TOM
  MID_TOM: MID_TOM
  FLOOR_TOM: FLOOR_TOM
  CRASH: CRASH
  RIDE: RIDE
  HIHAT_PEDAL: HIHAT_PEDAL
