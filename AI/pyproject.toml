[project]
name = "ssaplash-ai"
version = "0.1.0"
description = "싸플래쉬(SSAPLASH) AI 파트 — 채보 생성·드럼 분리·코칭 모델과 벤치마크 도구"
readme = "README.md"
authors = [
    { name = "김호준", email = "000304jun@naver.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    # 데이터 로더 (S15P31A307-103)
    "mido>=1.3.3",
    "numpy>=1.26,<3",
    "pyyaml>=6.0",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    # 지표 (S15P31A307-104 #2): museval=BSS Eval v4, mir_eval=온셋 매칭, librosa=온셋 검출, psutil=RSS
    "librosa>=0.10,<1",
    "mir-eval>=0.8",
    "museval>=0.4.1",
    "psutil>=5.9",
    # 드럼리스 MR 음량 차이 ITU-R BS.1770 (S15P31A307-165)
    "pyloudnorm>=0.1.1",
    # 기록·보고서 (#5·#6)
    "matplotlib>=3.9",
    "mlflow>=3.0",
    "pandas>=2.2",
    # 곡 추천 그래프의 희소 행렬(recommend)과 분리 후처리·STRUM 피크 찾기(bench)가 직접 쓴다
    "scipy>=1.13",
    # AI 서버 (S15P31A307-125). mlflow가 이미 끌어오는 패키지라 설치 목록은 늘지 않는다
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # 약점 분석 실측 보정 배치(coach_calibration)가 비식별 뷰를 읽는 DB 드라이버. libpq가 휠에 들어 있어 시스템 패키지가 필요 없다
    "psycopg[binary]>=3.2,<4",
    # 채보 워커(S15P31A307-171)가 BE 워커 API·서명 URL을 부르는 HTTP 클라이언트. mlflow가 이미 끌어오는 패키지라 설치 목록은 늘지 않는다
    "requests>=2.32",
    # 원곡 m4a(AAC·ALAC) 디코딩(S15P31A307-244). libsndfile이 못 여는 파일에만 씀. FFmpeg 라이브러리가 휠에 들어 있어 시스템 ffmpeg가 필요 없음
    "av>=14",
]

[project.optional-dependencies]
# 실제 분리 모델 실행용. 단위 테스트·CI에는 불필요. `uv sync --extra models`
# Windows는 아래 tool.uv.index의 CUDA 휠, Linux(코랩)는 PyPI 기본 휠(CUDA 포함)
models = [
    "torch>=2.7,<2.12",
    "torchaudio>=2.7,<2.12",
    "msst[bs-roformer,htdemucs]>=0.1.0",
    "demucs>=4.0.1",
    "openunmix>=1.3.0",
]
# Spleeter(spleeter==2.4.x)는 tensorflow 2.12·numpy<2·pandas<2 고정이라 이 환경과 충돌해 후보에서 제외 (ADR-014)
# 채보 모델 중 지금 환경에 같이 들어가는 것 (S15P31A307-109). `uv sync --extra models --extra transcribers`
# ADT_STR(torch 2.8 고정, 패키지 아님)·Inverse Drum Machine(numpy<2·librosa<0.10 고정)·Omnizart(TensorFlow)·
# YourMT3+(transformers 4.45.1·numpy 1.26 고정, 코드는 HF Space)·drum2midi(저장소 setup_env.py로 설치)는
# 별도 가상환경에서 scripts/transcribers_ext/ 스크립트로 돌린다 (README "채보 벤치마크" 절)
transcribers = [
    "adtof-pytorch @ git+https://github.com/xavriley/ADTOF-pytorch",
    "pretty-midi>=0.2.10",
    # 채보 bpm 추정 (S15P31A307-169, 설계 U15). 코드·가중치 MIT
    "beat-this>=1.1.0",
    # Beat This! DBN 후처리(설정 tempo.postprocess: dbn, S15P31A307-322). PyPI 0.16.1은 최신 파이썬에서
    # 빌드가 안 돼 git 커밋 고정. 원곡 박 기준 마디 맞는 곡 88 → 102/131 (설계 CHART-003-variable-tempo-exp)
    "madmom @ git+https://github.com/CPJKU/madmom@27f032e8947204902c675e5e341a3faf5dc86dae",
]
# 실시간 코칭 거름 모델 학습용. 서버 이미지에는 들어가지 않는다. `uv sync --extra coach-live`
coach-live = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "scikit-learn>=1.5",
]
# 분리 전 음악 여부 검사의 분류 모델 AST 실행용 (chart/music_check.py). torch는 models extra 것을 씀.
# 채보 워커 환경에 `uv sync --extra models --extra transcribers --extra music-check`
music-check = [
    "transformers>=4.40",
]

[project.scripts]
# AI/ 에서 `uv run ssaplash-bench check-data configs/bench/datasets/*.yaml`
ssaplash-bench = "ssaplash_ai.bench.cli:main"
# 서비스 추론 모듈 (S15P31A307-167). `uv run ssaplash-chart separate <원곡> --out <폴더>`
ssaplash-chart = "ssaplash_ai.chart.cli:main"
# 채보 모델 파인튜닝 (S15P31A307-164). `uv run ssaplash-train adtof-finetune --config configs/train/adtof_tom_5cls.yaml --out …`
ssaplash-train = "ssaplash_ai.train.cli:main"
# 채보 워커 (S15P31A307-171). `uv run ssaplash-worker run`, 환경 변수는 README "채보 워커 실행" 절
ssaplash-worker = "ssaplash_ai.worker.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "httpx2",  # FastAPI TestClient용(starlette이 httpx 대신 권장). 이미지에는 들어가지 않는다
]

# Windows 로컬(RTX 4070)용 CUDA 12.8 휠. explicit이라 아래 sources에 적은 패키지만 이 인덱스 사용
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# ---- 코드 검사 (ruff) ----
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# strum/drums_v13.py는 STRUM 저장소 원본 그대로 두는 파일
extend-exclude = ["data", "notebooks", "src/ssaplash_ai/bench/transcribers/strum/drums_v13.py"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import 정렬, B: 흔한 버그, UP: 최신 문법
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]  # 줄 길이는 formatter가 맞춘다

[tool.ruff.format]
quote-style = "double"

# ---- 테스트 (pytest) ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
