# h5: 탐 3종을 모델이 직접 내는 9패드 출력. adtof_tom_9cls.yaml에서 학습·검증 데이터·에폭·작업 수만 train_tom5_clean과 같게 (ai_2_to_4 8.11 가설 5)
base_checkpoint: null
classes: pads
