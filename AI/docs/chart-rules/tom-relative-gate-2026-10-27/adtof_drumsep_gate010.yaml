# S15P31A307-164 확인용: 기본 규칙 + 탐 거르기(tom_gate_ratio 0.10). 규칙만 다시 돌린 점수(rule-eval)와
# 실제 벤치마크(run-transcription)가 같은지 확인할 때 씀. 기본값 교체는 후속 작업에서.
#   uv run ssaplash-bench run-transcription --models docs/chart-rules/tom-relative-gate-2026-10-27/adtof_drumsep_gate010.yaml \
#       --dataset configs/bench/datasets/mdb_drums.yaml --input drums --run-id gate010-mdb
name: adtof_drumsep_gate010
adapter: adtof_drumsep
velocity: false
input_sample_rate: 44100
drumsep_config: configs/bench/models/msst/mdx23c_drumsep.yaml
rules:
  window_ms: 120
  cymbal_window_ms: 80
  tom_fmin: 50
  tom_fmax: 400
  tom_bands: [113, 142]
  tom_gate_ratio: 0.10
  stems:
    toms: toms
    crash: crash
    ride: ride
license_code: CC BY-NC-SA 4.0 (ADTOF) + MIT (msst)
license_weights: CC BY-NC-SA 4.0 (ADTOF 가중치) + 미명시 (MDX23C DrumSep 가중치, aufr33·jarredou 공개)
source_url: https://github.com/xavriley/ADTOF-pytorch
labels:
  KICK: KICK
  SNARE: SNARE
  HIHAT: HIHAT
  SMALL_TOM: SMALL_TOM
  MID_TOM: MID_TOM
  FLOOR_TOM: FLOOR_TOM
  CRASH: CRASH
  RIDE: RIDE
