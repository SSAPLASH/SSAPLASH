# 킥과 겹친 탐 지우기 후보 (S15P31A307-164). 파인튜닝 모델이 ENST drummer_1의 실제 킥을 킥과 플로어탐으로 함께 내서
# 정답 없는 탐의 42%가 ADTOF 킥 피크 ±30ms 안에 있었음(scripts/check_false_toms.py). 나머지는 채택 후보 pk_gap30과 같음.
# pk_gap30: 비교 기준. kd20/kd30/kd50: 플로어탐만, 킥과 20/30/50ms 안이면 버림. kd30_all: 탐 3종 모두.
# kd30_s95: 탐 확신 점수 0.95 미만만 버림(맞은 탐 점수 중앙값 0.97, 정답 없는 탐 0.87). kd30_th076: 탐 기준값 0.76과 같이
candidates:
- name: pk_gap30
  rules: {window_ms: 120, cymbal_window_ms: 80, tom_gate_ratio: 0.10, tom_peak_mode: raw, tom_mode: relative, tom_relative_naming: hybrid, tom_relative_method: peaks, tom_relative_min_gap: 3.0}
- name: kd20
  rules: {window_ms: 120, cymbal_window_ms: 80, tom_gate_ratio: 0.10, tom_peak_mode: raw, tom_mode: relative, tom_relative_naming: hybrid, tom_relative_method: peaks, tom_relative_min_gap: 3.0, tom_kick_drop_ms: 20}
- name: kd30
  rules: {window_ms: 120, cymbal_window_ms: 80, tom_gate_ratio: 0.10, tom_peak_mode: raw, tom_mode: relative, tom_relative_naming: hybrid, tom_relative_method: peaks, tom_relative_min_gap: 3.0, tom_kick_drop_ms: 30}
- name: kd50
  rules: {window_ms: 120, cymbal_window_ms: 80, tom_gate_ratio: 0.10, tom_peak_mode: raw, tom_mode: relative, tom_relative_naming: hybrid, tom_relative_method: peaks, tom_relative_min_gap: 3.0, tom_kick_drop_ms: 50}
- name: kd30_all
  rules: {window_ms: 120, cymbal_window_ms: 80, tom_gate_ratio: 0.10, tom_peak_mode: raw, tom_mode: relative, tom_relative_naming: hybrid, tom_relative_method: peaks, tom_relative_min_gap: 3.0, tom_kick_drop_ms: 30, tom_kick_drop_pads: [SMALL_TOM, MID_TOM, FLOOR_TOM]}
- name: kd30_s95
  rules: {window_ms: 120, cymbal_window_ms: 80, tom_gate_ratio: 0.10, tom_peak_mode: raw, tom_mode: relative, tom_relative_naming: hybrid, tom_relative_method: peaks, tom_relative_min_gap: 3.0, tom_kick_drop_ms: 30, tom_kick_drop_max_score: 0.95}
- name: kd30_th076
  rules: {window_ms: 120, cymbal_window_ms: 80, tom_gate_ratio: 0.10, tom_peak_mode: raw, tom_threshold: 0.76, tom_mode: relative, tom_relative_naming: hybrid, tom_relative_method: peaks, tom_relative_min_gap: 3.0, tom_kick_drop_ms: 30}
