# 파이프라인이 도는지 확인하는 골격이다. 파트별 스택이 확정되면 각 job의 script를 채운다.
stages:
  - lint
  - test
  - build

# MR을 만들거나 갱신할 때, 그리고 main·develop-*에 병합될 때만 실행한다.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop-.*)$/

default:
  image: alpine:3.20

lint:
  stage: lint
  script:
    - echo "lint 단계 - 스택 확정 후 린트 명령을 넣는다"

test:
  stage: test
  script:
    - echo "test 단계 - 스택 확정 후 테스트 명령을 넣는다"

build:
  stage: build
  script:
    - echo "build 단계 - 스택 확정 후 빌드 명령을 넣는다"

# BE 초기화 이후의 실제 검증. 기존 공통 골격은 다른 파트가 연결할 때까지 유지한다.
.be-job:
  image: eclipse-temurin:21-jdk-jammy
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-cache"
  before_script:
    - cd BE
  cache:
    key:
      files:
        - BE/gradle/wrapper/gradle-wrapper.properties
        - BE/build.gradle
    paths:
      - .gradle-cache/caches/
      - .gradle-cache/wrapper/
  rules:
    - changes:
        - BE/**/*
        - .gitlab-ci.yml

be-test:
  extends: .be-job
  stage: test
  script:
    - sh ./gradlew --no-daemon test
  artifacts:
    when: always
    reports:
      junit: BE/build/test-results/test/TEST-*.xml
    paths:
      - BE/build/reports/tests/test/
    expire_in: 1 week

be-build:
  extends: .be-job
  stage: build
  script:
    - sh ./gradlew --no-daemon bootJar
  artifacts:
    paths:
      - BE/build/libs/app.jar
    expire_in: 1 week
