# 파이프라인이 도는지 확인하는 골격이다. 파트별 스택이 확정되면 각 job의 script를 채운다.
stages:
  - lint
  - test
  - build
  - deploy

# MR을 만들거나 갱신할 때, 그리고 main·develop-*에 병합될 때만 실행한다.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop-.*)$/

# 모든 job은 EC2의 Docker Runner(태그 docker)에서 실행한다.
default:
  image: alpine:3.20
  tags:
    - docker

lint:
  stage: lint
  script:
    - echo "lint 단계 - 스택 확정 후 린트 명령을 넣는다"

test:
  stage: test
  script:
    - echo "test 단계 - 스택 확정 후 테스트 명령을 넣는다"

build:
  stage: build
  script:
    - echo "build 단계 - 스택 확정 후 빌드 명령을 넣는다"

# AI 코드 검사. AI/ 아래나 이 파일이 바뀐 MR·병합에서만 돈다. AI/README.md의 `ruff check .`·`ruff format --check .`와 같은 검사다.
# ruff 버전은 AI/uv.lock에서 읽어서 로컬(uv run ruff)과 항상 같게 맞춘다. 버전을 이 파일에 따로 적지 않는다.
# AI 테스트(pytest)는 아직 CI에 없다. 기존 시험 일부가 ffmpeg 등 환경에 의존해서 CI에서 어떻게 되는지 확인이 먼저다.
# 첫 규칙은 보정 배치(COACH-003)만 도는 예약·수동 파이프라인에서 이 job을 만들지 않게 한다. main에서 develop-BE의 `.calibration-guard`와
# 합쳐져도 같은 뜻이 되도록 job 안에 직접 적었다(develop-AI에는 `.calibration-guard` 정의가 없어 참조할 수 없다).
ai-lint:
  stage: lint
  image: python:3.11-slim
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  rules:
    - if: $COACH_CALIBRATION == "true" || $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
        - AI/**/*
        - .gitlab-ci.yml
  script:
    - RUFF_VERSION="$(grep -A1 '^name = "ruff"$' AI/uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
    - '[ -n "$RUFF_VERSION" ] || { echo "AI/uv.lock에서 ruff 버전을 읽지 못했습니다."; exit 1; }'
    - pip install --quiet "ruff==${RUFF_VERSION}"
    - ruff --version
    - cd AI
    - ruff check .
    - ruff format --check .

# AI 의존성 잠금 파일 검사. pyproject.toml을 바꿨는데 uv.lock을 안 고친 경우를 병합 전에 잡는다.
# 놓치면 배포 때 서버에서 AI 이미지를 빌드하다(`uv sync --frozen`) 실패한다. uv 버전은 이미지를 만드는 AI/Dockerfile과 같게 거기서 읽는다.
# AI 의존성(torch 등)을 받지 않고 uv만 설치해서 몇 초면 끝난다. 첫 규칙은 위 ai-lint와 같은 이유다.
ai-lock:
  stage: lint
  image: python:3.11-slim
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  rules:
    - if: $COACH_CALIBRATION == "true" || $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
        - AI/pyproject.toml
        - AI/uv.lock
        - AI/Dockerfile
        - .gitlab-ci.yml
  script:
    - UV_VERSION="$(grep -o 'uv==[0-9][0-9.]*' AI/Dockerfile | head -1 | cut -d= -f3)"
    - '[ -n "$UV_VERSION" ] || { echo "AI/Dockerfile에서 uv 버전을 읽지 못했습니다."; exit 1; }'
    - pip install --quiet "uv==${UV_VERSION}"
    - uv --version
    - cd AI
    - uv lock --check

# BE 초기화 이후의 실제 검증. 기존 공통 골격은 다른 파트가 연결할 때까지 유지한다.
.be-job:
  image: eclipse-temurin:21-jdk
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-cache"
  before_script:
    - cd BE
  cache:
    when: always
    key:
      files:
        - BE/gradle/wrapper/gradle-wrapper.properties
        - BE/build.gradle
    paths:
      - .gradle-cache/caches/
      - .gradle-cache/wrapper/
  rules:
    - changes:
        - BE/**/*
        - Infra/docker-compose.yml
        - .gitlab-ci.yml

be-test:
  extends: .be-job
  stage: test
  script:
    - ./gradlew --no-daemon test
  artifacts:
    when: always
    reports:
      junit: BE/build/test-results/test/TEST-*.xml
    paths:
      - BE/build/reports/tests/test/
    expire_in: 1 week

be-build:
  extends: .be-job
  stage: build
  script:
    - ./gradlew --no-daemon bootJar
  artifacts:
    paths:
      - BE/build/libs/app.jar
    expire_in: 1 week

# 일회용 TimescaleDB 컨테이너를 service로 붙여 Flyway 이력 전체를 검증한다. 실패를 허용하거나 건너뛰지 않는다.
# 이미지 버전은 Infra/docker-compose.yml의 postgres 이미지와 같아야 한다. 한쪽을 바꾸면 다른 쪽도 바꾼다.
be-timescale-test:
  extends: .be-job
  stage: test
  services:
    - name: timescale/timescaledb:2.30.2-pg16
      alias: timescaledb
      command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
  variables:
    # job 변수는 service 컨테이너에도 전달된다. 비밀번호는 이 job에서만 쓰는 일회용 값이다.
    POSTGRES_DB: timescale_test
    POSTGRES_PASSWORD: "ci-$CI_PIPELINE_ID"
    TIMESCALE_TEST_URL: "jdbc:postgresql://timescaledb:5432/timescale_test"
    TIMESCALE_TEST_PASSWORD: "ci-$CI_PIPELINE_ID"
  script:
    # service가 연결을 받을 때까지 최대 60초 기다린다.
    - bash -c 'for i in $(seq 1 60); do (echo > /dev/tcp/timescaledb/5432) 2>/dev/null && exit 0; sleep 1; done; echo "TimescaleDB가 60초 안에 준비되지 않았습니다."; exit 1'
    - ./gradlew --no-daemon timescaleTest
  artifacts:
    when: always
    reports:
      junit: BE/build/test-results/timescaleTest/TEST-*.xml
    paths:
      - BE/build/reports/tests/timescaleTest/
    expire_in: 1 week

# 배포. main에서만 만들어지고 사람이 직접 실행해야 돈다(승인). MR 파이프라인에는 만들어지지 않는다.
# EC2 호스트에서 직접 도는 배포 전용 러너(태그 deploy, 보호된 러너)가 실행한다. 서버 접속 키가 필요 없다.
# 서버의 .env(비밀번호, 키)는 서버에만 있고 CI 변수에 올리지 않는다.
.deploy-job:
  tags:
    - deploy
  # 배포와 롤백이 동시에 돌지 않게 한다.
  resource_group: production
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy:
  extends: .deploy-job
  stage: deploy
  script:
    - bash Infra/deploy/deploy.sh "$CI_COMMIT_SHA" "$CI_PROJECT_DIR"

# 이전 커밋으로 되돌린다. 실행할 때 변수 ROLLBACK_SHA에 커밋 해시를 넣으면 그 버전을, 비워 두면 직전에 성공한 버전을 다시 배포한다.
# DB 마이그레이션은 되돌리지 않는다. 새 마이그레이션이 적용된 뒤에는 옛 앱이 뜨지 않을 수 있어 Infra/deploy/README.md를 먼저 확인한다.
rollback:
  extends: .deploy-job
  stage: deploy
  variables:
    ROLLBACK_SHA: ""
  script:
    - |
      SHA="$ROLLBACK_SHA"
      if [ -z "$SHA" ]; then
        # 배포 기록의 마지막은 현재 버전이므로 그 앞 줄이 직전 성공 버전이다.
        COUNT=0
        [ -f /srv/airdrum/.deployed ] && COUNT="$(wc -l < /srv/airdrum/.deployed)"
        [ "$COUNT" -ge 2 ] || { echo "되돌릴 직전 배포 기록이 없습니다. ROLLBACK_SHA를 지정하세요."; exit 1; }
        SHA="$(tail -n 2 /srv/airdrum/.deployed | head -n 1 | awk '{print $2}')"
      fi
      echo "롤백 대상: $SHA"
      git fetch origin "$SHA"
      git checkout -f "$SHA"
      bash Infra/deploy/deploy.sh "$SHA" "$CI_PROJECT_DIR"
