stages:
  - lint
  - test
  - build
  - deploy

# MR을 만들거나 갱신할 때, 그리고 main·develop-*에 병합될 때만 실행한다.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop-.*)$/

# 모든 job은 EC2의 Docker Runner(태그 docker)에서 실행한다.
default:
  image: alpine:3.20
  tags:
    - docker

# 약점 분석 보정 배치(COACH-003)만 도는 파이프라인(예약 파이프라인, 또는 수동 실행에서 변수 COACH_CALIBRATION=true)에서는
# 다른 job을 만들지 않는다. 막지 않으면 예약 파이프라인마다 BE 시험이 도는데(예약에서는 rules:changes가 항상 참이다),
# 수동 배포·롤백 job도 대기 상태로 생긴다. 모든 기존 job의 rules 맨 앞에 이 규칙을 붙인다.
# COACH_CALIBRATION을 프로젝트 CI 변수로 등록하면 모든 파이프라인이 보정 전용이 되므로 등록하지 않는다(예약·수동 실행에서만 준다).
.calibration-guard:
  rules:
    - if: $COACH_CALIBRATION == "true" || $CI_PIPELINE_SOURCE == "schedule"
      when: never

# BE 검증 대상이 아닌 변경에도 파이프라인을 만든다. 실제 파트 검사를 대체하지 않는다.
pipeline-fallback:
  stage: lint
  rules:
    - !reference [.calibration-guard, rules]
    - changes: &be_changes
        - BE/**/*
        - Infra/docker-compose.yml
        - .gitlab-ci.yml
      when: never
    - when: on_success
  script:
    - echo "BE 검증 대상 변경이 없어 공통 파이프라인만 생성합니다."

# AI 검사 job(ai-lint, ai-lock)의 공통 설정. 러너의 컨테이너는 root가 아니고 홈이 `/`라서 pip이 시스템·홈 폴더에 설치하지 못한다
# (`Permission denied: '/.local'`). 그래서 쓰기 가능한 프로젝트 폴더 안에 가상환경을 만들어 거기에 설치하고, pip·uv 캐시도 프로젝트 폴더로 돌린다.
# before_script와 script는 같은 셸에서 이어서 실행되므로 여기서 활성화한 가상환경이 script에서도 유지된다.
.ai-check-job:
  stage: lint
  image: python:3.11-slim
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_NO_CACHE_DIR: "1"
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
    UV_PYTHON_DOWNLOADS: "never"
  before_script:
    - python -m venv "$CI_PROJECT_DIR/.ci-venv"
    - . "$CI_PROJECT_DIR/.ci-venv/bin/activate"

# AI 코드 검사. AI/ 아래나 이 파일이 바뀐 MR·병합에서만 돈다. AI/README.md의 `ruff check .`·`ruff format --check .`와 같은 검사다.
# ruff 버전은 AI/uv.lock에서 읽어서 로컬(uv run ruff)과 항상 같게 맞춘다. 버전을 이 파일에 따로 적지 않는다.
# AI 테스트(pytest)는 아직 CI에 없다. 기존 시험 일부가 ffmpeg 등 환경에 의존해서 CI에서 어떻게 되는지 확인이 먼저다.
# 첫 규칙은 보정 배치(COACH-003)만 도는 예약·수동 파이프라인에서 이 job을 만들지 않게 한다. main에서 develop-BE의 `.calibration-guard`와
# 합쳐져도 같은 뜻이 되도록 job 안에 직접 적었다(develop-AI에는 `.calibration-guard` 정의가 없어 참조할 수 없다).
ai-lint:
  extends: .ai-check-job
  rules:
    - if: $COACH_CALIBRATION == "true" || $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
        - AI/**/*
        - .gitlab-ci.yml
  script:
    - RUFF_VERSION="$(grep -A1 '^name = "ruff"$' AI/uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
    - '[ -n "$RUFF_VERSION" ] || { echo "AI/uv.lock에서 ruff 버전을 읽지 못했습니다."; exit 1; }'
    - pip install --quiet "ruff==${RUFF_VERSION}"
    - ruff --version
    - cd AI
    - ruff check .
    - ruff format --check .

# AI 의존성 잠금 파일 검사. pyproject.toml을 바꿨는데 uv.lock을 안 고친 경우를 병합 전에 잡는다.
# 놓치면 배포 때 서버에서 AI 이미지를 빌드하다(`uv sync --frozen`) 실패한다. uv 버전은 이미지를 만드는 AI/Dockerfile과 같게 거기서 읽는다.
# AI 의존성(torch 등)을 받지 않고 uv만 설치해서 몇 초면 끝난다. 첫 규칙은 위 ai-lint와 같은 이유다.
ai-lock:
  extends: .ai-check-job
  rules:
    - if: $COACH_CALIBRATION == "true" || $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
        - AI/pyproject.toml
        - AI/uv.lock
        - AI/Dockerfile
        - .gitlab-ci.yml
  script:
    - UV_VERSION="$(grep -o 'uv==[0-9][0-9.]*' AI/Dockerfile | head -1 | cut -d= -f3)"
    - '[ -n "$UV_VERSION" ] || { echo "AI/Dockerfile에서 uv 버전을 읽지 못했습니다."; exit 1; }'
    - pip install --quiet "uv==${UV_VERSION}"
    - uv --version
    - cd AI
    - uv lock --check

# BE 실제 검증.
.be-job:
  image: eclipse-temurin:21-jdk
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-cache"
  before_script:
    - cd BE
  cache:
    when: always
    key:
      files:
        - BE/gradle/wrapper/gradle-wrapper.properties
        - BE/build.gradle
    paths:
      - .gradle-cache/caches/
      - .gradle-cache/wrapper/
      - BE/.cache/audio-ffprobe/
  rules:
    - !reference [.calibration-guard, rules]
    - changes: *be_changes

be-test:
  extends: .be-job
  stage: test
  script:
    - . ./scripts/Prepare-AudioProbe.sh
    - ./gradlew --no-daemon test
  artifacts:
    when: always
    reports:
      junit: BE/build/test-results/test/TEST-*.xml
    paths:
      - BE/build/reports/tests/test/
    expire_in: 1 week

be-build:
  extends: .be-job
  stage: build
  script:
    - ./gradlew --no-daemon bootJar
  artifacts:
    paths:
      - BE/build/libs/app.jar
    expire_in: 1 week

# 두 실행 JAR은 각각 별도 아티팩트로 보관해 업로드 크기 제한을 피한다.
be-midi-worker-build:
  extends: .be-job
  stage: build
  script:
    - ./gradlew --no-daemon bootMidiWorkerJar
  artifacts:
    paths:
      - BE/build/libs/midi-worker.jar
    expire_in: 1 week

# 실제 FluidSynth/FFmpeg 실행 경로를 일반 단위 테스트와 별도로 검증한다.
be-midi-render-test:
  extends: .be-job
  image: eclipse-temurin:21-jdk-jammy
  stage: test
  script:
    - PREPARE_AUDIO_FFMPEG=true; export PREPARE_AUDIO_FFMPEG; . ./scripts/Prepare-AudioProbe.sh
    - . ./scripts/Prepare-MidiRenderer.sh
    - MIDI_TEST_FFMPEG="$AUDIO_FFMPEG_PATH"; MIDI_TEST_FFPROBE="$AUDIO_FFPROBE_PATH"; export MIDI_TEST_FFMPEG MIDI_TEST_FFPROBE
    - ./gradlew --no-daemon test --tests '*MidiRendererIntegrationTest'
  artifacts:
    when: always
    reports:
      junit: BE/build/test-results/test/TEST-*.xml
    paths:
      - BE/build/reports/tests/test/
    expire_in: 1 week

# 일회용 TimescaleDB 컨테이너를 service로 붙여 Flyway 이력 전체를 검증한다. 실패를 허용하거나 건너뛰지 않는다.
# 이미지 버전은 Infra/docker-compose.yml의 postgres 이미지와 같아야 한다. 한쪽을 바꾸면 다른 쪽도 바꾼다.
be-timescale-test:
  extends: .be-job
  stage: test
  services:
    - name: timescale/timescaledb:2.30.2-pg16
      alias: timescaledb
      command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
  variables:
    # job 변수는 service 컨테이너에도 전달된다. 비밀번호는 이 job에서만 쓰는 일회용 값이다.
    POSTGRES_DB: timescale_test
    POSTGRES_PASSWORD: "ci-$CI_PIPELINE_ID"
    TIMESCALE_TEST_URL: "jdbc:postgresql://timescaledb:5432/timescale_test"
    TIMESCALE_TEST_PASSWORD: "ci-$CI_PIPELINE_ID"
  script:
    # service가 연결을 받을 때까지 최대 60초 기다린다.
    - bash -c 'for i in $(seq 1 60); do (echo > /dev/tcp/timescaledb/5432) 2>/dev/null && exit 0; sleep 1; done; echo "TimescaleDB가 60초 안에 준비되지 않았습니다."; exit 1'
    - ./gradlew --no-daemon timescaleTest
  artifacts:
    when: always
    reports:
      junit: BE/build/test-results/timescaleTest/TEST-*.xml
    paths:
      - BE/build/reports/tests/timescaleTest/
    expire_in: 1 week

# FE 실제 검증. 노드 버전은 FE/Dockerfile과 같아야 한다. 한쪽을 바꾸면 다른 쪽도 바꾼다.
# 기존 공통 골격(lint, test, build)은 다른 파트가 연결할 때까지 유지한다.
.fe-job:
  image: node:22-alpine
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/FE/.npm-cache"
  before_script:
    - cd FE
    - npm ci --no-audit --no-fund
  cache:
    key:
      files:
        - FE/package-lock.json
    paths:
      - FE/.npm-cache/
  rules:
    - changes:
        - FE/**/*
        - .gitlab-ci.yml

fe-lint:
  extends: .fe-job
  stage: lint
  script:
    - npm run lint

fe-test:
  extends: .fe-job
  stage: test
  script:
    - npm run test

fe-build:
  extends: .fe-job
  stage: build
  script:
    - npm run build

# 배포. main에서만 만들어지고 사람이 직접 실행해야 돈다(승인). MR 파이프라인에는 만들어지지 않는다.
# EC2 호스트에서 직접 도는 배포 전용 러너(태그 deploy, 보호된 러너)가 실행한다. 서버 접속 키가 필요 없다.
# 서버의 .env(비밀번호, 키)는 서버에만 있고 CI 변수에 올리지 않는다.
.deploy-job:
  tags:
    - deploy
  # 배포와 롤백이 동시에 돌지 않게 한다.
  resource_group: production
  environment:
    name: production
  rules:
    - !reference [.calibration-guard, rules]
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy:
  extends: .deploy-job
  stage: deploy
  script:
    - bash Infra/deploy/deploy.sh "$CI_COMMIT_SHA" "$CI_PROJECT_DIR"

# 이전 커밋으로 되돌린다. 실행할 때 변수 ROLLBACK_SHA에 커밋 해시를 넣으면 그 버전을, 비워 두면 직전에 성공한 버전을 다시 배포한다.
# DB 마이그레이션은 되돌리지 않는다. 새 마이그레이션이 적용된 뒤에는 옛 앱이 뜨지 않을 수 있어 Infra/deploy/README.md를 먼저 확인한다.
rollback:
  extends: .deploy-job
  stage: deploy
  allow_failure: true
  variables:
    ROLLBACK_SHA: ""
  script:
    - |
      SHA="$ROLLBACK_SHA"
      if [ -z "$SHA" ]; then
        # 배포 기록의 마지막은 현재 버전이므로 그 앞 줄이 직전 성공 버전이다.
        COUNT=0
        [ -f /srv/airdrum/.deployed ] && COUNT="$(wc -l < /srv/airdrum/.deployed)"
        [ "$COUNT" -ge 2 ] || { echo "되돌릴 직전 배포 기록이 없습니다. ROLLBACK_SHA를 지정하세요."; exit 1; }
        SHA="$(tail -n 2 /srv/airdrum/.deployed | head -n 1 | awk '{print $2}')"
      fi
      echo "롤백 대상: $SHA"
      git fetch origin "$SHA"
      git checkout -f "$SHA"
      bash Infra/deploy/deploy.sh "$SHA" "$CI_PROJECT_DIR"

# 약점 분석 실측 보정 배치(COACH-003). 동의한 사용자의 비식별 기록으로 임계값 후보를 만들어 MLflow에 기록한다. 임계값을 바꾸지 않는다.
# 실행 방법은 두 가지이고 둘 다 main에서만 된다.
#   1. 예약(Build > Pipeline schedules): 대상 브랜치 main, 변수 COACH_CALIBRATION=true. 매일 한 번 돈다.
#   2. 수동(Build > Pipelines > Run pipeline): 브랜치 main, 변수 COACH_CALIBRATION=true. 새 세션이 모자라도 돌리려면 COACH_CALIBRATION_FORCE=true를 더한다.
# 서버에 배포된 소스(/srv/airdrum)와 서버 .env로 실행하므로 저장소 체크아웃은 쓰지 않는다. 배포와 같은 보호된 러너·같은 resource_group이라
# 배포·롤백과 겹쳐 돌지 않는다. 배치가 실패하면(종료 코드 1) job이 실패하고 GitLab이 알린다.
# 이미지가 오래되지 않게 --build를 붙인다(레이어 캐시가 있어 바뀐 게 없으면 빠르다). 한 번에 최소 30초가 걸린다(Infra/README.md).
coach-calibration:
  stage: deploy
  tags:
    - deploy
  resource_group: production
  timeout: 30m
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $COACH_CALIBRATION == "true" && $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(schedule|web)$/
  script:
    - cd /srv/airdrum/Infra
    - |
      ARGS=""
      if [ "$COACH_CALIBRATION_FORCE" = "true" ]; then ARGS="--force"; fi
      docker compose -p infra --profile calibration run --build --rm coach-calibration $ARGS
