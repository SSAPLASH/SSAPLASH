# FE 컨테이너 안의 Nginx 설정. 정적 파일(dist)만 서빙한다. /api는 서버 앞단 Nginx(Infra)가 BE로 보낸다.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 컨테이너 상태 확인용
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # 파일 이름에 해시가 붙은 빌드 결과. 내용이 바뀌면 이름이 바뀌므로 오래 캐시해도 된다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 효과음 등 해시가 없는 정적 파일. 바뀔 수 있어서 하루만 캐시한다.
    location /sounds/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 그 밖의 주소는 모두 index.html로 보낸다(브라우저 라우터가 화면을 정한다).
    # index.html은 새 배포가 바로 반영되도록 캐시하지 않는다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
